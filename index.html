<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<title>Gym</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0A0A0B; --s1:#161618; --s2:#202023; --s3:#2C2C30; --line:#2A2A2E;
  --ink:#F5F5F7; --ink2:#A1A1A6; --ink3:#6E6E73;
  --acc:#C8F547; --acc-ink:#0A0A0B; --acc-soft:rgba(200,245,71,.14);
  --red:#FF6B5B; --blue:#5AB4F0; --pink:#F2729F; --amber:#F5B83D;
  --r:14px; --spring:cubic-bezier(.32,.72,0,1); --pop:cubic-bezier(.3,1.6,.5,1);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

#app{max-width:520px;margin:0 auto;min-height:100%;position:relative}
#view{padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 110px)}
#view.enter{animation:enter 420ms var(--spring) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* cabecera */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 2px 18px}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
h1{margin:2px 0 0;font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
h2{margin:26px 2px 10px;font-size:20px;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--ink2)}
.small{font-size:13px}

/* semana */
.week{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:var(--s1)}
.week .big{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.02em}
.week .big small{font-size:18px;color:var(--ink2);font-weight:600}
.dots{display:flex;gap:6px;margin-left:auto}
.dots i{width:26px;height:26px;border-radius:50%;background:var(--s3);display:block;transition:background .4s,transform .4s var(--pop)}
.dots i.on{background:var(--acc);transform:scale(1.04)}

/* tarjetas de día */
.day{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:16px;margin-top:10px;border-radius:var(--r);background:var(--s1);text-align:left;overflow:hidden;transition:transform .18s var(--pop)}
.day:active{transform:scale(.97)}
.day .bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--dc)}
.day .t{font-size:19px;font-weight:700}
.day .m{font-size:14px;color:var(--ink2);margin-top:2px}
.day .go{margin-left:auto;flex-shrink:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--s3);color:var(--ink)}
.day.sug{padding:20px 18px 18px;display:block;background:linear-gradient(180deg,var(--s2),var(--s1))}
.day.sug .lbl{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc-ink);background:var(--dc);padding:3px 8px;border-radius:6px}
.day.sug .t{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:10px;line-height:1.05}
.day.sug .start{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;margin-top:16px;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-size:18px;font-weight:800}
.resume{background:var(--acc)!important;color:var(--acc-ink)}
.resume .m{color:rgba(10,10,11,.7)!important}
.resume .go{background:rgba(10,10,11,.15)!important;color:var(--acc-ink)!important}
.hist{display:flex;justify-content:space-between;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line);font-size:15px}
.hist b{font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px}
.pill:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dc)}

/* entreno */
.wtop{position:sticky;top:0;z-index:5;margin:calc(-14px - var(--st)) -16px 12px;padding:calc(var(--st) + 8px) 12px 10px;background:rgba(10,10,11,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.iconbtn:active{background:var(--s2)}
.wtop .tt{text-align:center;line-height:1.15}
.wtop .tt b{display:block;font-size:16px}
.wtop .tt span{font-size:13px;color:var(--ink2)}
.finish{height:36px;padding:0 14px;border-radius:18px;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:15px}
.prog{height:4px;border-radius:2px;background:var(--s3);overflow:hidden;margin:0 2px 14px}
.prog i{display:block;height:100%;background:var(--dc);border-radius:2px;transition:width .5s var(--spring)}

.ex{border-radius:var(--r);background:var(--s1);margin-bottom:10px;overflow:hidden;transition:background .3s}
.ex.alldone{background:#141A0B}
.exh{display:flex;align-items:center;gap:10px;width:100%;padding:14px 14px 12px;text-align:left}
.exh .nm{font-size:17px;font-weight:700;line-height:1.2}
.exh .mt{font-size:13px;color:var(--ink2);margin-top:3px}
.exh .cnt{margin-left:auto;flex-shrink:0;font-size:14px;font-weight:700;color:var(--ink2);min-width:36px;text-align:right}
.ex.alldone .exh .cnt{color:var(--acc)}
.chev{flex-shrink:0;transition:transform .45s var(--spring);color:var(--ink3)}
.ex.open .exh .chev{transform:rotate(180deg)}
.exb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--spring)}
.ex.open .exb{grid-template-rows:1fr}
.exb>div{min-height:0;overflow:hidden}
.exin{padding:0 12px 14px}
.opt{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);background:var(--s3);padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:2px}
.last{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 12px;border-radius:10px;background:var(--s2);font-size:14px;color:var(--ink2);margin-bottom:10px}
.last b{color:var(--ink);font-weight:600}
.sgc{font-size:13px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--s3);color:var(--ink)}
.sgc.up{background:var(--acc);color:var(--acc-ink)}
.cols,.set{display:grid;grid-template-columns:24px 1.28fr 1fr 48px;gap:7px;align-items:center}
.cols{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);padding:0 0 6px}
.cols span:nth-child(2),.cols span:nth-child(3){text-align:center}
.set{padding:4px 0;border-radius:10px;transition:background .3s}
.set .n{font-size:15px;font-weight:700;color:var(--ink3);text-align:center}
.stp{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;height:48px;border-radius:10px;background:var(--s2);overflow:hidden}
.stp button{height:48px;font-size:22px;font-weight:500;color:var(--ink2)}
.stp button:active{background:var(--s3);color:var(--ink)}
.stp input{width:100%;min-width:0;height:48px;border:0;background:none;color:var(--ink);text-align:center;font:700 18px/1 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-variant-numeric:tabular-nums;padding:0;border-radius:0}
.stp input::placeholder{color:var(--ink3);font-weight:600}
.stp input:focus{outline:none;background:var(--s3)}
.chk{width:48px;height:48px;border-radius:12px;background:var(--s2);display:grid;place-items:center;color:var(--ink3);transition:background .25s,color .25s,transform .25s var(--pop)}
.chk:active{transform:scale(.9)}
.set.done .chk{background:var(--acc);color:var(--acc-ink)}
.set.done .stp{background:rgba(200,245,71,.08)}
.set.done .n{color:var(--acc)}
.set.pop .chk{animation:pop .45s var(--pop)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.exf{display:flex;gap:8px;margin-top:10px}
.exf button{flex:1;height:40px;border-radius:10px;background:var(--s2);font-size:14px;font-weight:600;color:var(--ink2)}
.exf button:active{background:var(--s3)}
.add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:var(--r);border:1.5px dashed var(--s3);color:var(--ink2);font-weight:600;margin-top:4px}

/* descanso */
#rest{position:fixed;left:50%;bottom:calc(var(--sb) + 12px);z-index:30;width:calc(100% - 24px);max-width:496px;transform:translate(-50%,160%);transition:transform .55s var(--spring);border-radius:20px;background:rgba(32,32,35,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 20px 50px -12px rgba(0,0,0,.8);padding:14px 14px 12px;overflow:hidden}
#rest.on{transform:translate(-50%,0)}
#rest .row{display:flex;align-items:center;gap:10px}
#rest .lb{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
#rest .tm{font-size:42px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#rest .ctl{margin-left:auto;display:flex;gap:6px}
#rest .ctl button{height:44px;min-width:52px;padding:0 10px;border-radius:12px;background:var(--s3);font-weight:700;font-size:15px}
#rest .ctl button.skip{background:var(--ink);color:var(--bg)}
#rest .track{height:5px;border-radius:3px;background:var(--s3);margin-top:12px;overflow:hidden}
#rest .track i{display:block;height:100%;width:100%;background:var(--acc);border-radius:3px;transform-origin:left;transition:transform .25s linear}
#rest.end{background:var(--acc);color:var(--acc-ink)}
#rest.end .lb{color:rgba(10,10,11,.7)}
#rest.end .track{display:none}
#rest.end .ctl button{background:rgba(10,10,11,.15);color:var(--acc-ink)}
#rest.end .tm{font-size:34px;animation:pulse .6s var(--pop) 2}
#rest.end [data-act=rest-add]{display:none}
@keyframes pulse{50%{transform:scale(1.08)}}

/* pestañas */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 0 calc(var(--sb) + 6px);background:rgba(10,10,11,.86);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
#tabs div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
#tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;justify-content:center;color:var(--ink3);text-decoration:none;font-size:11px;font-weight:600}
#tabs a.on{color:var(--acc)}
body.inworkout #tabs{display:none}

/* progreso */
.pr{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:var(--r);background:var(--s1);margin-top:8px;text-align:left;transition:transform .18s var(--pop)}
.pr:active{transform:scale(.97)}
.pr .nm{font-size:16px;font-weight:600;line-height:1.2}
.pr .v{font-size:14px;color:var(--ink2);margin-top:3px}
.pr svg{margin-left:auto;flex-shrink:0}
.delta{font-size:13px;font-weight:700;color:var(--acc)}
.delta.flat{color:var(--ink3)}
.seg{display:flex;padding:3px;border-radius:10px;background:var(--s2);margin:4px 0 14px}
.seg button{flex:1;height:36px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink2);transition:background .3s,color .3s}
.seg button.on{background:var(--s3);color:var(--ink)}
.chart{position:relative;padding:14px 10px 8px;border-radius:var(--r);background:var(--s1)}
.chart svg{display:block;width:100%;height:auto;touch-action:none}
.tip{position:absolute;top:8px;pointer-events:none;padding:6px 10px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;white-space:nowrap;transform:translateX(-50%);opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{padding:12px;border-radius:12px;background:var(--s1)}
.stat .k{font-size:12px;color:var(--ink2)}
.stat .v{font-size:20px;font-weight:800;margin-top:2px;letter-spacing:-.01em}
.srow{padding:12px 2px;border-bottom:1px solid var(--line)}
.srow .d{font-size:13px;color:var(--ink2)}
.srow .s{font-size:15px;margin-top:2px}

/* rutina */
.rx{display:flex;align-items:center;gap:6px;padding:10px 6px 10px 14px;border-radius:12px;background:var(--s1);margin-top:8px}
.rx .nm{font-size:15px;font-weight:600;line-height:1.2}
.rx .mt{font-size:13px;color:var(--ink2);margin-top:2px}
.rx .grow{flex:1;min-width:0}
.rx .iconbtn{width:40px;height:40px;color:var(--ink2)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border-radius:12px;background:var(--s1);margin-top:8px}
.btn{height:46px;padding:0 16px;border-radius:12px;background:var(--s2);font-weight:700;font-size:15px}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn.danger{background:var(--red);color:#fff}
.btn:active{transform:scale(.97)}
.mini{display:grid;grid-template-columns:40px 48px 40px;align-items:center;height:40px;border-radius:10px;background:var(--s2);overflow:hidden}
.mini button{height:40px;font-size:20px;color:var(--ink2)}
.mini span{text-align:center;font-weight:700}
.switch{width:52px;height:32px;border-radius:16px;background:var(--s3);position:relative;transition:background .3s}
.switch:after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .35s var(--pop)}
.switch.on{background:var(--acc)}
.switch.on:after{transform:translateX(20px)}

/* hoja inferior */
#sheet{position:fixed;inset:0;z-index:40}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .35s}
#sheet .pn{position:absolute;left:50%;bottom:0;width:100%;max-width:520px;max-height:88%;overflow-y:auto;overscroll-behavior:contain;transform:translate(-50%,100%);transition:transform .5s var(--spring);border-radius:22px 22px 0 0;background:var(--s1);padding:10px 16px calc(var(--sb) + 18px)}
#sheet.on .bd{opacity:1}
#sheet.on .pn{transform:translate(-50%,0)}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--s3);margin:0 auto 14px}
#sheet h3{margin:0 0 6px;font-size:22px;font-weight:800;letter-spacing:-.01em}
#sheet p{margin:0 0 14px;color:var(--ink2);font-size:15px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.fld{display:block;margin-top:12px}
.fld span{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px}
.fld input[type=text]{width:100%;height:48px;border-radius:12px;border:0;background:var(--s2);color:var(--ink);padding:0 14px;font:600 16px -apple-system,system-ui,sans-serif}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:16px}
.pick:active{background:var(--s2)}

/* catálogo y fotos */
.srch{position:sticky;top:-10px;z-index:3;box-shadow:0 -12px 0 var(--s1),0 6px 12px -6px rgba(0,0,0,.6);width:100%;height:44px;border-radius:12px;border:0;background:var(--s2);color:var(--ink);padding:0 14px;font:500 16px -apple-system,system-ui,sans-serif;margin:4px 0 8px;-webkit-appearance:none;appearance:none}
.srch::placeholder{color:var(--ink3)}
.grp{margin-top:6px}
.grph{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 2px;font-size:17px;font-weight:800;letter-spacing:-.01em}
.grph small{font-size:13px;font-weight:600;color:var(--ink3);margin-left:6px}
.grph .chev{color:var(--ink3)}
.grp.open>.grph .chev{transform:rotate(180deg)}
.grpb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--spring)}
.grp.open>.grpb{grid-template-rows:1fr}
.grpb>div{min-height:0;overflow:hidden}
.pki{border-radius:12px;background:var(--s2);margin-bottom:6px;overflow:hidden}
.pkh{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;text-align:left;font-size:15px;font-weight:600}
.pkh .th{width:52px;height:40px;border-radius:8px;background-repeat:no-repeat;background-color:var(--s3);flex-shrink:0}
.pkh .nm{flex:1;min-width:0;line-height:1.2}
.pkh .tag{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.pki .pkb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--spring)}
.pki.open .pkb{grid-template-rows:1fr}
.pki.open .chev{transform:rotate(180deg)}
.pkb>div{min-height:0;overflow:hidden}
.pkin{padding:0 10px 10px}
.ph{position:relative;border-radius:12px;overflow:hidden;background:#fff;aspect-ratio:4/3}
.ph .f{position:absolute;inset:0;background-repeat:no-repeat}
.ph .f.b{animation:frames 2.6s ease-in-out infinite}
@keyframes frames{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
.ph .cr{position:absolute;right:6px;bottom:6px;padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:600}
.pkadd{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;margin-top:8px;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:16px}
.pkadd[disabled]{background:var(--s3);color:var(--ink3)}
.howto{display:flex;align-items:center;gap:10px;width:100%;padding:6px;margin-bottom:10px;border-radius:10px;background:var(--s2);font-size:14px;font-weight:600;color:var(--ink2);text-align:left}
.howto .th{width:44px;height:34px;border-radius:7px;background-repeat:no-repeat;background-color:var(--s3)}
.howto .chev{margin-left:auto}
.ex.phon .howto .chev{transform:rotate(180deg)}
.exph{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--spring)}
.ex.phon .exph{grid-template-rows:1fr}
.exph>div{min-height:0;overflow:hidden}
.exph .ph{margin-bottom:10px}
.rx .th{display:block;width:44px;height:34px;border-radius:7px;background-repeat:no-repeat;background-color:var(--s3);flex-shrink:0}
.steps{margin:10px 0 0;padding-left:20px;color:var(--ink2);font-size:14px;line-height:1.45}
.steps b{color:var(--ink)}

/* resumen */
.hero{padding:26px 18px;border-radius:20px;background:var(--acc);color:var(--acc-ink);text-align:center;animation:heroIn .7s var(--pop) both}
@keyframes heroIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.hero .t{font-size:30px;font-weight:800;letter-spacing:-.02em}
.hero .m{font-size:15px;font-weight:600;opacity:.75;margin-top:4px}
.prl{display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;background:var(--s1);margin-top:8px;animation:enter .5s var(--spring) both}
.prl .b{font-size:12px;font-weight:800;color:var(--acc-ink);background:var(--acc);padding:3px 7px;border-radius:6px}
#toast{position:fixed;left:50%;top:calc(var(--st) + 10px);z-index:60;transform:translate(-50%,-160%);transition:transform .45s var(--spring);padding:10px 16px;border-radius:20px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;max-width:90%}
#toast.on{transform:translate(-50%,0)}
.empty{padding:28px 18px;border-radius:var(--r);background:var(--s1);color:var(--ink2);text-align:center;font-size:15px}
@media (prefers-reduced-motion: reduce){*,*:before,*:after{animation-duration:1ms!important;transition-duration:1ms!important}}
</style>
</head>
<body>
