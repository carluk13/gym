/* ================= ui/40-routine.js =================
   Rutina y ajustes (#/r, #/r/<día>), hoja Editar ejercicio (exForm) y selector de ejercicios (pickEx).
   SPEC §2.9 to §2.11 (SCR/visual/ux), Aurora, judge §6.3 (scrolling sheet body, actions at the bottom, the
   destructive text button at the END of the body, far from Guardar, with its trash glyph).

   Public for other groups (names and signatures kept):
     pickEx(title, exclude, cb, o)  opens the selector sheet. cb(id, created) gets the chosen id (catalog ids are
                                    added to S.ex first; created is true for "Crear un ejercicio propio").
                                    o (optional): { sub, toast, day } sheet subtitle, the toast after adding, and
                                    the target day id (left out of the "En Pierna" hints). The routine keeps the sheet
                                    open after an add; the workout's cb closes it and opens the ficha.
     exForm(x, dayId)               HTML of the Editar ejercicio sheet (x null: a new exercise). sheet(exForm(...)).

   Data (FOUNDATION §2): edits MERGE into S.ex[x] and write only what he changed. ex.step, ex.bar and ex.wu are
   written only when he picks a value; picking "Automático" removes his override. Settings write S.goal, S.sound,
   S.itimer, S.bw, S.wu, S.fb only on change. Reordering only permutes days[].ex. Removing from a day keeps
   S.ex[x] and all history. UI-only key outside gym.v1: gym.lastExport (ms of the last copy saved from here).
   Damaged data: a day that is not an object with an id (null, a string...) is skipped here, never removed, and the
   settings and Copia de seguridad always render, even if the day part fails (Guardar is the way out). */
SCREENS.r = function (p) { VIEW.scr = 'routine'; VIEW.tab = 'r'; return routine(p[1]); };

/* ---------- state and copy ---------- */
var RT = { day: null, sort: false };
/* Up and down arrows of the Ordenar mode (heavier stroke, judge §6) */
var RT_UP = svgI('<path d="M6 15l6-6 6 6"/>', 2.4), RT_DN = svgI('<path d="M6 9l6 6 6-6"/>', 2.4);
/* Equipment words for the picker meta and the sheet subtitle */
var RT_EQ = { barbell: 'Barra', dumbbell: 'Mancuernas', cable: 'Polea', machine: 'Máquina', body: 'Peso corporal' };
/* Preset loads for "Salto de peso" and "Barra" (kg); the learned value and his current one are added when missing */
var RT_STEPS = [0.5, 1, 1.25, 2, 2.5, 3, 4, 4.5, 5, 6, 7, 10];
var RT_BARS = [5, 7, 7.5, 10, 12.5, 15, 20, 25];
var RT_WU_H = {
  auto: 'Te propone una sola serie más ligera antes de cada ejercicio, como sueles hacer.',
  off: 'No te propone ninguno. En el entreno puedes añadir uno a mano.'
};
var RT_FB_H = {
  auto: 'Mismo peso en todas. Solo baja en las últimas si el salto es grande y no llegarías al mínimo.',
  same: 'Siempre el mismo peso. Si una serie cuesta, haces menos reps.',
  drop: 'Baja un salto en las últimas cuando no llegarías al mínimo, aunque el salto sea pequeño.'
};

/* ---------- Rutina ---------- */
/* The days this screen can show: objects with an id. Anything else in S.days (null, a string, an array) is skipped */
function rtDays() {
  return (Array.isArray(S.days) ? S.days : []).filter(function (d) { return !!d && typeof d === 'object' && !Array.isArray(d) && d.id != null && d.id !== ''; });
}
/* Day of an id (route text or a stored id, compared as text), or null */
function rtDayOf(id) { if (id == null) return null; var a = rtDays().filter(function (d) { return String(d.id) === String(id); }); return a[0] || null; }
/* Name of a day ("Pecho y tríceps"); its id when it has no name */
function rtDayName(d) { return String(d && (d.n || d.id) || 'Día'); }
/* Exercise ids of a day (a list that is not an array reads as empty) */
function rtDayEx(d) { return d && Array.isArray(d.ex) ? d.ex : []; }
/* Short day label for the segmented control: the first word, or the full name when two days share it */
function rtDayShort(d) {
  var n = rtDayName(d), w = n.split(' ')[0] || n;
  var dup = rtDays().filter(function (y) { return y !== d && rtDayName(y).split(' ')[0] === w; }).length;
  return dup ? n : w;
}
/* Equipment word of an exercise profile ('Barra', 'Máquina'...); assisted lifts say 'Asistida' */
function rtEqWord(f) { return f.asis ? 'Asistida' : RT_EQ[f.eq] || 'Máquina'; }
/* Row line "3 × 6 a 10 · 2:30 · salto 2,5 kg" (assisted: "· asistida"; timed holds: seconds, no step) */
function rtScheme(x) {
  var e = S.ex[x] || {}, f = exInfo(x), s = (num(e.sets) || 0) + ' × ' + (num(e.min) || 0) + ' a ' + (num(e.max) || 0) + (f.secs ? ' s' : '') + ' · ' + mmss(num(e.rest) || 0);
  if (e.asis) s += ' · asistida';
  else if (!f.secs) s += ' · salto ' + fk(exStep(x)) + ' kg';
  return s;
}
/* Rutina: the day part, then Ajustes and Copia de seguridad. Each part is built on its own, so damaged data in a day
   or a setting never hides Guardar, which is what he needs most when something is wrong */
function routine(dayId) {
  var h = pageHead('Tus días', 'Rutina');
  try { h += rtDayPart(dayId); }
  catch (e) {
    console.error('routine', e); RT.sort = false;
    h += '<section class="section rt-day">' + listCard(emptyNote('No he podido mostrar este día. Los ajustes y la copia de seguridad siguen abajo.')) + '</section>';
  }
  try { h += rtSettings(); } catch (e) { console.error('rtSettings', e); }
  return h + rtBackup();
}
/* Segmented control of the days, the list of the day (or the Ordenar mode) and Añadir */
function rtDayPart(dayId) {
  var days = rtDays(), d = rtDayOf(dayId || RT.day) || days[0], h = '';
  if (!d) { RT.sort = false; return '<section class="section rt-day">' + listCard(emptyNote('No hay días en la rutina.')) + '</section>'; }
  if (RT.day !== d.id) RT.sort = false;
  RT.day = d.id;
  if (!Array.isArray(d.ex)) d.ex = [];
  if (d.ex.length < 2) RT.sort = false;
  var name = rtDayName(d), n = d.ex.length;
  if (days.length > 1) h += seg(days.map(function (x) { return [x.id, esc(rtDayShort(x))]; }), d.id, 'rday', 'd', { big: true, label: 'Día', cls: 'rt-days' });
  /* the toggle says what it does next (Ordenar / Listo); no aria-pressed on top of the label change */
  var aside = n > 1 ? '<button type="button" class="section-aside' + (RT.sort ? ' rt-on' : '') + '" data-act="rt-sort">' +
    (RT.sort ? I.check + '<span>Listo</span>' : I.reorder + '<span>Ordenar</span>') + '</button>' : '';
  var rows = d.ex.map(function (x, k) { return RT.sort ? rtSortRow(x, k, n) : rtRow(x); }).join('');
  h += '<section class="section rt-day" aria-labelledby="rt-h">' + sectionHead(nb(name + ' · ' + n), 'rt-h', aside) +
    listCard(rows || emptyNote('Sin ejercicios todavía. Añade el primero.'), 'rt-list' + (RT.sort ? ' rt-sorting' : ''));
  if (RT.sort) h += '<p class="foot">Sube o baja cada ejercicio con las flechas, o arrástralo por las tres rayas. Toca Listo al terminar.</p>';
  else h += '<button type="button" class="btn rt-add" data-act="radd">' + I.plus + '<span>' + esc('Añadir a ' + name.toLowerCase()) + '</span></button>' +
    '<p class="foot">El orden es solo el de la lista: en el gimnasio puedes hacerlos como quieras.</p>';
  return h + '</section>';
}
/* Exercise row: the whole row opens Editar (64 px target); the pencil only pictures it. A ficha that cannot be read
   still gets a row (with its name when there is one), so one bad exercise never hides the day */
function rtRow(x) {
  var e = S.ex[x], trail = '<span class="rt-edit">' + I.edit + '<span class="sr">Editar</span></span>';
  if (!e || typeof e !== 'object') return row({ act: 'redit', data: { x: x }, img: null, title: 'Ejercicio sin ficha', wrap: true, sub: 'Toca para completarla', trail: trail, cls: 'rx' });
  var sub = ''; try { sub = rtScheme(x); } catch (er) { sub = 'Toca para revisarlo'; }
  return row({ act: 'redit', data: { x: x }, img: e.img || null, title: String(e.n || 'Ejercicio sin nombre'), wrap: true, tag: e.opt ? 'Opcional' : '', sub: sub, trail: trail, cls: 'rx' });
}
/* Row in "Ordenar" mode: the name, Subir and Bajar (44 px buttons: VoiceOver, keyboard and one tap) and the drag
   handle (pointer only, hidden from assistive tech: the buttons do the same). No photo, so long names keep room */
function rtSortRow(x, k, n) {
  var e = S.ex[x], name = e && e.n ? String(e.n) : 'Ejercicio sin ficha', pos = ' (' + (k + 1) + ' de ' + n + ')';
  return '<div class="row no-thumb rt-row" data-k="' + k + '"><span class="row-body"><span class="row-title">' + esc(name) +
    (e && e.opt ? tagHtml('Opcional') : '') + '</span></span><span class="row-trail rt-moves">' +
    '<button type="button" class="icon-btn rt-mv" data-act="rt-mv" data-k="' + k + '" data-s="-1" aria-label="' + esc('Subir ' + name + pos) + '"' + (k ? '' : ' disabled') + '>' + RT_UP + '</button>' +
    '<button type="button" class="icon-btn rt-mv" data-act="rt-mv" data-k="' + k + '" data-s="1" aria-label="' + esc('Bajar ' + name + pos) + '"' + (k < n - 1 ? '' : ' disabled') + '>' + RT_DN + '</button>' +
    '<span class="rt-handle" data-k="' + k + '" aria-hidden="true">' + I.reorder + '</span></span></div>';
}

/* ---------- Ajustes ---------- */
function rtSettings() {
  var bw = bodyWeight(), wu = warmMode(), fb = backoffMode(), h = '';
  h += '<section class="section" aria-labelledby="rt-ha">' + sectionHead('Ajustes', 'rt-ha') + '<div class="card list settings">' +
    '<div class="sblock"><span class="srow-k">Tema</span>' + seg([['dark', 'Oscuro'], ['light', 'Claro']], isLight() ? 'light' : 'dark', 'rt-theme', 'v', { label: 'Tema' }) + '</div>' +
    switchRow('glass', 'Más opaco', 'Menos transparencia en barras y tarjetas. Útil al sol.', isSolid()) +
    '<div class="srow"><span><span class="srow-k">Objetivo semanal</span><span class="srow-h">Entrenos por semana</span></span>' + miniStep('goal', num(S.goal) || 3, null, 'entrenos por semana') + '</div>' +
    valueRow('rt-bw', 'Peso corporal', 'Opcional. Mide mejor dominadas y fondos asistidos.', bw ? fk(bw) + ' kg' : 'Sin indicar') +
    '</div></section>';
  h += '<section class="section" aria-labelledby="rt-hc">' + sectionHead('Entrenador', 'rt-hc') + '<div class="card list settings">' +
    '<div class="sblock"><span class="srow-k">Calentamiento</span><span class="srow-h">Una serie más ligera antes de la primera de trabajo. Se marca con ' + cInline() + 'y no cuenta.</span>' +
    seg([['auto', 'Automático'], ['off', 'No proponer']], wu, 'rt-wu', 'v', { label: 'Calentamiento' }) +
    '<p class="rt-opt-h" id="rt-wu-h">' + esc(nb(RT_WU_H[wu])) + '</p></div>' +
    '<div class="sblock"><span class="srow-k">Series descendentes</span><span class="srow-h">Si el salto de peso es grande, qué hacer en las últimas series.</span>' +
    seg([['auto', 'Automático'], ['same', 'Mismo peso'], ['drop', 'Bajar peso']], fb, 'rt-fb', 'v', { label: 'Series descendentes' }) +
    '<p class="rt-opt-h" id="rt-fb-h">' + esc(nb(RT_FB_H[fb])) + '</p></div>' +
    '</div></section>';
  h += '<section class="section" aria-labelledby="rt-hd">' + sectionHead('Descanso', 'rt-hd') + '<div class="card list settings">' +
    switchRow('sound', 'Sonido al acabar', 'Con el iPhone en silencio no suena.', !!S.sound) +
    switchRow('itimer', 'Temporizador del iPhone', 'Suena aunque el iPhone esté en silencio o bloqueado. Necesita un atajo: te guío al activarlo.', !!S.itimer) +
    (S.itimer ? valueRow('rt-ihelp', 'Cómo preparar el atajo', 'El atajo «Descanso Gym» de la app Atajos', 'Ver') : '') +
    '</div></section>';
  return h;
}
/* Copia de seguridad: Guardar and Cargar always render (the reminder line is left out if it cannot be worked out) */
function rtBackup() {
  var last = ''; try { last = rtBackupNote(); } catch (e) { last = ''; }
  return '<section class="section" aria-labelledby="rt-hb">' + sectionHead('Copia de seguridad', 'rt-hb') +
    '<div class="btn-row"><button type="button" class="btn" data-act="rt-export">' + I.save + '<span>Guardar</span></button>' +
    '<button type="button" class="btn" data-act="import">' + I.load + '<span>Cargar</span></button></div>' +
    (last ? '<p class="foot rt-last">' + esc(nb(last)) + '</p>' : '') +
    '<p class="foot">Tus datos solo están en este iPhone: guarda una copia de vez en cuando. Cargar sustituye lo que hay y antes deja aparte una copia de lo actual. Versión 9.</p>' +
    rtPrevRow() + '</section>';
}
/* The copy kept aside by the last Cargar (gym.v1.antes-de-cargar): a quiet line and a way back to it, so "se puede
   recuperar" stays true after the sheet shown right after loading is closed. '' when there is none */
function rtPrevRow() {
  var p = null; try { p = prevLoad(); } catch (e) { p = null; }
  if (!p) return '';
  if (!p.st) return '<p class="foot rt-prev">' + esc(nb('Hay una copia aparte de la última carga que no se puede abrir. Puedes guardarla en un archivo.')) + '</p>' +
    '<div class="btn-row"><button type="button" class="btn" data-act="prev-export">' + I.save + '<span>Guardar la copia aparte</span></button></div>';
  var n = p.sum.n, t = 'Copia aparte, de la última carga: ' + plural(n, 'entreno', 'entrenos') + (n && p.sum.last ? ' (el último, ' + whenTxt(p.sum.last) + ')' : '') + '.';
  return '<p class="foot rt-prev">' + esc(nb(t)) + '</p>' +
    '<div class="btn-row"><button type="button" class="btn" data-act="undo-load-ask">Volver a la copia aparte</button></div>';
}
/* Time of the last copy saved from this screen (localStorage gym.lastExport), or null (also for a value that is not a date) */
function rtLastExport() { var t = 0; try { t = +localStorage.getItem('gym.lastExport'); } catch (e) {} return t > 0 && isFinite(new Date(t).getTime()) ? t : null; }
/* Quiet reminder "Última copia guardada: 14 oct, hace 8 días." ('' when unknown) */
function rtBackupNote() {
  var t = rtLastExport(); if (!t) return '';
  var a = ago(t), y = new Date(t).getFullYear(), d = dayMonth(t) + (y !== new Date().getFullYear() ? ' de ' + y : '');
  var s = 'Última copia guardada: ' + (a === 'hoy' ? 'hoy a las ' + clockTxt(t) : a === 'ayer' ? 'ayer' : d + ', ' + a) + '.';
  if (dayDiff(t, Date.now()) > 30) s += ' Conviene guardar otra.';
  return s;
}
/* Saves the backup like exportData() and remembers when: after the share sheet succeeds, or right away for a download.
   With unreadable data (BLOCK) it exports the rescued text instead and remembers nothing */
function rtExport() {
  if (BLOCK) { ACT['rescue-export'](); return; }
  var txt = JSON.stringify(S), name = 'gym-copia-' + new Date().toISOString().slice(0, 10) + '.json', file = null, can = false;
  try { file = new File([txt], name, { type: 'application/json' }); can = !!(navigator.canShare && navigator.share && navigator.canShare({ files: [file] })); } catch (e) { can = false; }
  if (can) { navigator.share({ files: [file], title: 'Copia de Gym' }).then(rtExported, function () {}); return; }
  saveFile(txt, name); rtExported();
}
function rtExported() {
  try { localStorage.setItem('gym.lastExport', String(Date.now())); } catch (e) {}
  toast('Copia guardada');
  if (route().charAt(0) === 'r') render(false);
}
function rtItimerSheet() {
  sheet(sheetHead('Temporizador del iPhone', 'Una vez, en la app Atajos') + '<div class="sheet-scroll"><ol class="sheet-text rt-steps">' +
    '<li>Abre la app <b>Atajos</b> y toca <b>+</b>.</li><li>Ponle de nombre exactamente <b>Descanso Gym</b>.</li><li>Añade la acción <b>Iniciar temporizador</b>.</li>' +
    '<li>Toca la duración, elige <b>Entrada del atajo</b> y pon la unidad en <b>segundos</b>.</li><li>Guárdalo y toca <b>Probar</b> aquí abajo.</li></ol>' +
    '<p class="sheet-text">Después, cada descanso abre el atajo: el temporizador sale en la pantalla bloqueada y suena aunque el iPhone esté en silencio.</p></div>' +
    '<div class="sheet-actions"><button type="button" class="btn-primary" data-act="itest">Probar con 10' + NB + 's</button></div>', { fit: true });
}

/* ---------- hoja: editar o crear ejercicio ---------- */
/* FM: the form in progress { _x id or null, _day, _t touched fields, _cb, _toast, _sy scroll, _secs, n, sets, min, max,
   rest, asis, opt, step, bar, wu } (step, bar, wu: null = Automático) */
var FM = null;
var FM_LIM = { sets: [1, 10], min: [1, 60], max: [1, 60], rest: [15, 600] };
/* ex.wu as stored, a number 0..3, or null (Automático). The form offers Auto, Ninguna (0) and Una (1): the coach reads 2 and 3 as 1 */
function rtWuOf(v) { var n = num(v); return n != null && n >= 0 && n <= 3 && Math.round(n) === n ? n : null; }
function exForm(x, dayId) {
  var e = x ? S.ex[x] || {} : {}, secs = x ? exInfo(x).secs : false;
  FM = { _x: x || null, _day: dayId || null, _t: {}, _cb: null, _toast: null, _sy: 0, _secs: secs,
    n: e.n || '', sets: num(e.sets) || 3, min: num(e.min) || (secs ? 30 : 8), max: num(e.max) || (secs ? 60 : 12), rest: num(e.rest) || 90,
    asis: !!e.asis, opt: !!e.opt, step: num(e.step) > 0 ? num(e.step) : null, bar: e.bar != null && e.bar !== '' && num(e.bar) >= 0 ? num(e.bar) : null, wu: rtWuOf(e.wu) };
  if (FM.min > FM.max) FM.max = FM.min;
  return rtFormHtml();
}
/* Value of a lib reading without his override of field k (ex.step or ex.bar), restored right after; null without an id */
function rtAuto(x, k, fn) {
  var e = x && S.ex[x]; if (!x) return null;
  if (!e || !Object.prototype.hasOwnProperty.call(e, k)) return fn(x);
  var v = e[k], r = null;
  delete e[k];
  try { r = fn(x); } catch (er) { r = null; }
  e[k] = v;
  return r;
}
function rtAutoStep(x) { return rtAuto(x, 'step', exStep); }
function rtAutoBar(x) { return rtAuto(x, 'bar', function (y) { return exInfo(y).bar; }); }
function rtCell(f, label) {
  var v = f === 'rest' ? mmss(FM.rest) : fk(FM[f]), w = label.toLowerCase();
  return '<div class="form-cell"><span class="srow-k">' + esc(label) + '</span><div class="mini-step"><button type="button" data-act="fm" data-f="' + f + '" data-s="-1" aria-label="' + esc('Menos ' + w) + '">' + I.minus +
    '</button><b class="num" id="fm-' + f + '">' + esc(v) + '</b><button type="button" data-act="fm" data-f="' + f + '" data-s="1" aria-label="' + esc('Más ' + w) + '">' + I.plus + '</button></div></div>';
}
function rtStepRow() {
  var auto = rtAutoStep(FM._x), v, hint;
  if (FM.step != null) { v = fk(FM.step) + ' kg'; hint = auto != null ? 'Fijo. Automático sería ' + fk(auto) + ' kg' : 'Fijo, lo has elegido tú'; }
  else { v = auto != null ? fk(auto) + ' kg' : 'Auto'; hint = auto != null ? 'Automático: lo aprende de tus pesos' : 'Lo aprenderá de tus pesos'; }
  return valueRow('rt-step', 'Salto de peso', hint, v);
}
function rtBarRow() {
  var auto = rtAutoBar(FM._x), v = FM.bar != null ? FM.bar : auto;
  return valueRow('rt-bar', 'Barra', (FM.bar != null ? 'Fija. ' : '') + 'Cuenta para el calentamiento y los discos', v > 0 ? fk(v) + ' kg' : 'Sin barra');
}
function rtFormHtml() {
  var x = FM._x, d = rtDayOf(FM._day), e = x ? S.ex[x] : null, f = x ? exInfo(x) : null, secs = FM._secs;
  var sub = [d ? rtDayName(d) : x ? '' : 'Ejercicio propio', f ? (f.kind === 'bb' ? 'barra libre' : rtEqWord(f).toLowerCase()) : ''].filter(function (s) { return s; }).join(' · ');
  var h = sheetHead(x ? (e && e.n) || 'Ejercicio sin ficha' : 'Nuevo ejercicio', nb(sub)) + '<div class="sheet-scroll" id="rt-fs">';
  h += '<label class="field-label" for="fm-n">Nombre</label><input type="text" class="field" id="fm-n" value="' + esc(FM.n) + '" placeholder="Por ejemplo, elevaciones laterales" autocomplete="off" autocapitalize="sentences" enterkeyhint="done">';
  h += '<div class="form-grid rt-cells">' + rtCell('sets', 'Series') + rtCell('rest', 'Descanso') +
    rtCell('min', secs ? 'Segundos mínimos' : 'Reps mínimas') + rtCell('max', secs ? 'Segundos máximos' : 'Reps máximas') + '</div>';
  h += '<div class="card list settings rt-fset">' + rtStepRow();
  if (x && f && (f.kind === 'bb' || FM.bar != null)) h += rtBarRow();
  h += '<div class="sblock"><span class="srow-k">Calentamiento</span><span class="srow-h">Una serie ' + cInline() + 'más ligera antes de la primera de trabajo. Auto sigue tu costumbre.' +
    (warmMode() === 'off' ? ' Ahora no se propone: está desactivado en Ajustes.' : '') + '</span>' +
    seg([['auto', 'Auto'], ['0', 'Ninguna'], ['1', 'Una']], FM.wu == null ? 'auto' : String(Math.min(FM.wu, 1)), 'rt-fwu', 'v', { label: 'Serie de calentamiento', cls: 'rt-wuseg' }) + '</div>';
  h += switchRow('fmt', 'Asistida', 'El peso es ayuda: menos es mejor', FM.asis, { f: 'asis' });
  h += switchRow('fmt', 'Opcional', 'Sale aparte en el entreno: lo haces si te apetece', FM.opt, { f: 'opt' });
  h += '</div>';
  if (x && d && rtDayEx(d).indexOf(x) >= 0) h += '<button type="button" class="btn-danger rt-del" data-act="fm-del">' + esc('Quitar de ' + rtDayName(d).toLowerCase()) + '</button>';
  h += '</div><div class="sheet-actions"><button type="button" class="btn-primary" data-act="fm-save">Guardar</button></div>';
  return h;
}
/* Sub-sheet head: title, subtitle and a 44 px button on the right (Volver) */
function rtHead(t, sub, act, label) {
  return '<div class="sheet-head"><div><h2 class="sheet-title" id="sheet-t">' + esc(t) + '</h2>' + (sub ? '<p class="sheet-sub">' + esc(nb(sub)) + '</p>' : '') +
    '</div><button type="button" class="btn-small" data-act="' + act + '">' + esc(label) + '</button></div>';
}
/* "Salto de peso" or "Barra" chooser inside the same sheet: Automático, then a grid of fixed values, all in ONE
   radiogroup (one choice). A tap picks and returns to the form */
function rtValHtml(k) {
  var isStep = k === 'step', auto = isStep ? rtAutoStep(FM._x) : rtAutoBar(FM._x), cur = FM[k], opts = (isStep ? RT_STEPS : RT_BARS).slice(), t = isStep ? 'Salto de peso' : 'Barra';

};
