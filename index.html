<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<title>Gym</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script>
(function () { var l = false; try { l = localStorage.getItem('gym.theme') === 'light'; } catch (e) {}
  if (l) { document.documentElement.classList.add('light'); document.querySelector('meta[name=theme-color]').setAttribute('content', '#F2F2F7'); } })();
</script>
<style>
@property --p{syntax:'<number>';inherits:true;initial-value:0}
:root{
  --bg:#000000; --s1:#1C1C1E; --s2:#2C2C2E; --s3:#3A3A3C; --line:rgba(84,84,88,.65); --line2:rgba(84,84,88,.35);
  --ink:#FFFFFF; --ink2:rgba(235,235,245,.6); --ink3:rgba(235,235,245,.3);
  --acc:#B4F42C; --accbg:#B4F42C; --acc-ink:#000000; --acc-soft:rgba(122,224,0,.16);
  --g1:#7AE000; --g2:#C6FF3D; --gt:rgba(122,224,0,.18);
  --c1:#00AEEF; --c2:#5CF2FF; --ct:rgba(0,174,239,.18); --cy:#3FD8FF;
  --p1:#FF1F5A; --p2:#FF6FA0; --pt:rgba(255,31,90,.2); --pk:#FF6FA0;
  --or:#FFB340; --or-soft:rgba(255,159,10,.18); --red:#FF453A; --amber:#FFB340; --blue:#3FD8FF; --pink:#FF6FA0;
  --glass:rgba(40,40,42,.62); --glhi:rgba(255,255,255,.14); --glsh:0 10px 36px -10px rgba(0,0,0,.8);
  --sheetbg:rgba(28,28,30,.84); --fill:rgba(118,118,128,.24); --thumb:#636366; --tabon:rgba(255,255,255,.12);
  --h0:#2C2C2E; --h1:#3D5A0F; --h2:#6FA314; --h3:#B4F42C; --k1:#3C8FD0; --k2:#D9508A; --k3:#BD8210;
  --capsh:rgba(0,0,0,.55); --scrim:rgba(0,0,0,.55); --duo:grayscale(1) contrast(1.06) brightness(.86);
  --r:22px; --spring:cubic-bezier(.25,1,.5,1); --pop:cubic-bezier(.3,1.5,.5,1);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --rd:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color-scheme:dark;
}
:root.light{
  --bg:#F2F2F7; --s1:#FFFFFF; --s2:#E9E9EE; --s3:#D9D9DE; --line:rgba(60,60,67,.29); --line2:rgba(60,60,67,.14);
  --ink:#000000; --ink2:rgba(60,60,67,.6); --ink3:rgba(60,60,67,.3);
  --acc:#3F8F00; --acc-soft:rgba(76,187,0,.14);
  --g1:#4DBB00; --g2:#A3E600; --gt:rgba(76,187,0,.16);
  --c1:#0092EA; --c2:#2FCBEF; --ct:rgba(0,146,234,.14); --cy:#007DC4;
  --p1:#F0104F; --p2:#FF5C93; --pt:rgba(240,16,79,.13); --pk:#E0336F;
  --or:#C26A00; --or-soft:rgba(255,149,0,.16); --red:#FF3B30; --amber:#C26A00; --blue:#007DC4; --pink:#E0336F;
  --glass:rgba(255,255,255,.72); --glhi:rgba(255,255,255,.9); --glsh:0 10px 30px -12px rgba(0,0,0,.22);
  --sheetbg:rgba(255,255,255,.86); --fill:rgba(118,118,128,.12); --thumb:#FFFFFF; --tabon:rgba(0,0,0,.06);
  --h0:#E5E5EA; --h1:#CDEFA0; --h2:#8ACB35; --h3:#4F9A00; --k1:#2F6FC9; --k2:#D14E84; --k3:#B8760C;
  --capsh:rgba(0,0,0,.2); --scrim:rgba(0,0,0,.3); --duo:grayscale(1) contrast(1.04) brightness(1.02);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;letter-spacing:inherit}
a{color:inherit;text-decoration:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num,.rd{font-family:var(--rd);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
[hidden]{display:none!important}
.tap{transition:transform .26s var(--pop),opacity .2s}
.tap:active{transform:scale(.96);opacity:.85}

/* cambio de tema */
.theming *,.theming *:before,.theming *:after{transition:none!important}
::view-transition-old(root){animation:none}
::view-transition-new(root){animation:vt-reveal 680ms cubic-bezier(.45,0,.2,1) both;mix-blend-mode:normal}
::view-transition-group(root){animation-duration:680ms}
@keyframes vt-reveal{from{clip-path:circle(0px at var(--vx,50%) var(--vy,0px))}to{clip-path:circle(var(--vr,150vmax) at var(--vx,50%) var(--vy,0px))}}
.tgl{width:36px;height:36px;border-radius:18px;background:var(--s2);color:var(--ink);display:grid;place-items:center;flex-shrink:0}
.tgl svg{animation:spin .52s var(--pop) both}
.tgl .moon{display:none}
.light .tgl .sun{display:none}.light .tgl .moon{display:block}
@keyframes spin{from{opacity:0;transform:rotate(-120deg) scale(.4)}to{opacity:1;transform:none}}

#app{max-width:520px;margin:0 auto;min-height:100%;position:relative}
#view{position:relative;z-index:1;padding:calc(var(--st) + 18px) 16px calc(var(--sb) + 120px)}
#view.enter{animation:enter 480ms var(--spring) both}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes push{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
#view.push{animation:push 460ms var(--spring) both}
.in{animation:enter 620ms var(--spring) both}

/* tipografía */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:18px 4px 20px}
.top .acts2{display:flex;gap:10px;margin-bottom:4px}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:0}
h1{margin:2px 0 0;font-size:34px;line-height:41px;font-weight:700;letter-spacing:.005em}
h2{margin:26px 4px 10px;font-size:22px;line-height:28px;font-weight:700;letter-spacing:.005em}
.sh{margin:22px 20px 8px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--ink2)}
.foot{margin:8px 20px 0;font-size:13px;line-height:18px;color:var(--ink2)}
.muted{color:var(--ink2)}
.small{font-size:13px}
.card{border-radius:var(--r);background:var(--s1)}
.pad{padding:16px}

/* listas agrupadas estilo iOS */
.list{border-radius:var(--r);background:var(--s1);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:0 0 0 16px;text-align:left;transition:background .2s}
.row:active{background:var(--s2)}
.row .bd{display:flex;align-items:center;gap:10px;flex:1;min-width:0;align-self:stretch;padding:10px 16px 10px 0;box-shadow:inset 0 -.5px 0 var(--line)}
.row:last-child .bd{box-shadow:none}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t1{font-size:17px;line-height:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t2{font-size:13px;line-height:17px;color:var(--ink2)}
.row .tr{font-size:15px;color:var(--ink3);flex-shrink:0}
.chv{flex-shrink:0;color:var(--ink3)}
.ico{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;flex-shrink:0;background:color-mix(in srgb,var(--dc,var(--acc)) 20%,transparent);color:var(--dc,var(--acc))}
.th{display:block;width:56px;height:42px;border-radius:10px;flex-shrink:0;background-color:#fff;background-repeat:no-repeat;filter:var(--duo)}
.th.sm{width:48px;height:36px;border-radius:9px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;font-size:17px;box-shadow:inset 0 -.5px 0 var(--line)}
.kv:last-child{box-shadow:none}
.kv .v{color:var(--ink2);text-align:right}
.kv .v.acc{color:var(--acc);font-weight:600}
.opt{font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink2);background:var(--fill);padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}

/* anillos */
.rg{position:relative;border-radius:50%;flex-shrink:0}
.rg.abs{position:absolute}
.rg.g{--a:var(--g1);--b:var(--g2);--t:var(--gt)}
.rg.c{--a:var(--c1);--b:var(--c2);--t:var(--ct)}
.rg.p{--a:var(--p1);--b:var(--p2);--t:var(--pt)}
.rg i{position:absolute;inset:0;border-radius:50%;display:block}
.rg .rt,.rg .ra{-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - var(--w)),#000 calc(100% - var(--w) + .5px));mask:radial-gradient(farthest-side,transparent calc(100% - var(--w)),#000 calc(100% - var(--w) + .5px))}
.rg .rt{background:var(--t)}
.rg .ra{background:conic-gradient(var(--a) 0deg,var(--b) calc(var(--p)*3.6deg),transparent 0);animation:fill 1.5s var(--d,.2s) var(--spring) both}
.rg .c0{inset:0 auto auto 50%;width:var(--w);height:var(--w);transform:translateX(-50%);background:var(--a)}
.rg .c1{border-radius:0;transform:rotate(calc(var(--p)*3.6deg));animation:fill 1.5s var(--d,.2s) var(--spring) both;pointer-events:none}
.rg .c1:after{content:"";position:absolute;top:0;left:50%;width:var(--w);height:var(--w);margin-left:calc(var(--w) / -2);border-radius:50%;background:var(--b);box-shadow:3px 0 5px var(--capsh)}
.rg.z .c0,.rg.z .c1{display:none}
@keyframes fill{from{--p:0}}
.rg.live .ra,.rg.live .c1{animation:none;transition:--p .7s var(--spring)}

/* inicio */
.rings{display:flex;align-items:center;gap:22px;padding:20px;border-radius:26px;background:var(--s1)}
.rings .rbox{position:relative;width:132px;height:132px;flex-shrink:0}
.rings .lbs{display:flex;flex-direction:column;gap:12px;min-width:0}
.rings .lb{font-size:15px;font-weight:600}
.rings .lv{font-size:26px;line-height:30px;font-weight:600}
.rings .lv small{font-size:17px}
.rings .ls{font-size:13px;color:var(--ink2)}
.today{display:flex;flex-direction:column;gap:16px;padding:18px;border-radius:26px;background:var(--s1)}
.today .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.today .nm{font-size:22px;line-height:26px;font-weight:700}
.today .mt{font-size:15px;color:var(--ink2);margin-top:3px}
.today .big{width:44px;height:44px;border-radius:22px}
.thumbs{display:flex;gap:6px}
.thumbs span{flex:1 1 0;aspect-ratio:4/3;border-radius:14px;background-color:#fff;background-repeat:no-repeat;filter:var(--duo)}
.today .kvs{border-top:.5px solid var(--line);padding-top:4px}
.today .kvs .kv{min-height:36px;font-size:15px;box-shadow:none}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:26px;background:var(--accbg);color:var(--acc-ink);font-size:17px;font-weight:600;transition:transform .26s var(--pop)}
.cta:active{transform:scale(.97)}
.cta.sec{background:var(--fill);color:var(--ink)}
.cta.red{background:transparent;color:var(--red)}
.lnk{display:block;text-align:center;font-size:15px;font-weight:600;color:var(--acc);padding:2px 0}
.resume .live{display:inline-block;position:relative;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:6px;vertical-align:1px}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:6px;vertical-align:1px;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}

/* barra superior de entreno */
.nav{position:sticky;top:0;z-index:5;margin:calc(-18px - var(--st)) -16px 18px;padding:calc(var(--st) + 6px) 16px 10px;background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);box-shadow:inset 0 -.5px 0 var(--line)}
.nav .r1{display:grid;grid-template-columns:96px 1fr 96px;align-items:center;min-height:44px}
.nav .bk{display:flex;align-items:center;gap:4px;height:44px;color:var(--acc);font-size:17px}
.nav .tt{text-align:center;line-height:1.2;min-width:0}
.nav .tt b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .tt span{font-size:13px;color:var(--ink2);font-family:var(--rd);font-variant-numeric:tabular-nums}
.nav .fin{justify-self:end;height:44px;color:var(--acc);font-size:17px;font-weight:600}
.nav .pg{display:flex;align-items:center;gap:10px;margin-top:6px}
.nav .pg .tk{position:relative;flex:1;height:4px;border-radius:2px;background:var(--gt);overflow:hidden}
.nav .pg .tk i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .7s var(--spring)}
.nav .pg span{font-size:13px;font-weight:600;color:var(--ink2);font-family:var(--rd);font-variant-numeric:tabular-nums}
.nav.plain{position:relative;background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}

/* forma del día */
.form{display:flex;align-items:center;gap:16px;padding:16px;border-radius:var(--r);background:var(--s1)}
.form .rbox{position:relative;width:64px;height:64px;flex-shrink:0}
.form .rbox b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:600;font-family:var(--rd);font-variant-numeric:tabular-nums}
.form .ft{font-size:17px;font-weight:600;line-height:1.2}
.form .fs{font-size:13px;color:var(--ink2);margin-top:3px}
.form.up .ft{color:var(--acc)}
.form.down .ft{color:var(--amber)}
.fdots{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.fdots i{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink3);transition:background .4s,box-shadow .4s,transform .4s var(--pop)}
.fdots i.up{background:var(--acc);box-shadow:none}
.fdots i.eq{background:var(--ink3);box-shadow:none}
.fdots i.down{background:var(--amber);box-shadow:none}
.fdots i.cur{transform:scale(1.35)}

/* lista de ejercicios del entreno */
.mring{position:relative;width:34px;height:34px;flex-shrink:0}
.mring svg{display:block;transform:rotate(-90deg)}
.mring .ok{position:absolute;inset:0;display:grid;place-items:center;color:var(--acc);animation:pop .42s var(--pop) both}
.row.done .t1{color:var(--ink2)}
.row.done .th{opacity:.5}
.vd{flex-shrink:0;display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 6px;border-radius:11px;font-size:12px;font-weight:700}
.vd.up{background:var(--acc-soft);color:var(--acc)}
.vd.eq{background:var(--fill);color:var(--ink2)}
.vd.down{background:var(--or-soft);color:var(--amber)}
.add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;margin-top:22px;border-radius:26px;background:var(--fill);color:var(--acc);font-size:17px;font-weight:600}

/* detalle de ejercicio */
.hero{position:relative;height:210px;border-radius:26px;overflow:hidden;background:#fff;display:flex;justify-content:center}
.hero .fw{position:relative;width:280px;height:210px;flex-shrink:0}
.hero .f{position:absolute;inset:0;background-repeat:no-repeat;animation:kb 1.8s var(--spring) both}
.hero .f.b{animation:kb 1.8s var(--spring) both,frames 2.6s ease-in-out infinite}
@keyframes kb{from{transform:scale(1.08)}to{transform:none}}
@keyframes frames{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
.hero .cr{position:absolute;right:8px;bottom:8px;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.5);color:#fff;font-size:10px;font-weight:600}
.exttl{margin:18px 4px 18px}
.exttl h1{font-size:28px;line-height:34px}
.exttl .mt{font-size:15px;color:var(--ink2);margin-top:4px}
.grp2{padding:0 16px;border-radius:var(--r);background:var(--s1)}
.cols,.set{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:center}
.cols{margin:22px 16px 8px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--ink2)}
.cols span:nth-child(2),.cols span:nth-child(3){text-align:center}
.set{position:relative;padding:12px 0;box-shadow:inset 0 -.5px 0 var(--line)}
.set:last-child{box-shadow:none}
.set .n{font-size:17px;font-weight:600;color:var(--ink3);font-family:var(--rd)}
.stp{display:grid;grid-template-columns:30px minmax(0,1fr) 30px;align-items:center}
.stp button{width:30px;height:30px;border-radius:15px;background:var(--s2);color:var(--ink2);font-size:18px;line-height:30px;transition:transform .2s var(--pop),background .2s}
.stp button:active{transform:scale(.88);background:var(--s3)}
.stp input{width:100%;min-width:0;height:40px;border:0;background:none;color:var(--ink);text-align:center;font:600 22px/1 var(--rd);font-variant-numeric:tabular-nums;letter-spacing:-.02em;padding:0;border-radius:10px;-webkit-appearance:none;appearance:none}
.stp input::placeholder{color:var(--ink3)}
.stp input:focus{outline:none;background:var(--s2)}
.chk{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;justify-self:end;color:transparent;box-shadow:inset 0 0 0 2px var(--ink3);transition:transform .25s var(--pop),background .25s,box-shadow .25s,color .25s}
.chk:active{transform:scale(.88)}
.set.done .chk{background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:none;color:#000}
.set.done .stp input{color:var(--acc)}
.set.done .n{color:var(--acc)}
.set.done.eq .n{color:var(--ink2)}
.set.done.down .n{color:var(--amber)}
.set.pop .chk{animation:pop .45s var(--pop)}
@keyframes pop{0%{transform:scale(.6)}55%{transform:scale(1.15)}100%{transform:scale(1)}}
.fly{position:absolute;right:50px;top:50%;z-index:3;padding:4px 10px;border-radius:12px;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none;animation:fly 1.6s var(--spring) forwards}
.fly.up{background:var(--accbg);color:#000}
.fly.eq{background:var(--ink);color:var(--bg)}
.fly.down{background:var(--amber);color:#000}
@keyframes fly{0%{opacity:0;transform:translateY(-50%) scale(.6)}15%{opacity:1;transform:translateY(-110%) scale(1.05)}70%{opacity:1;transform:translateY(-150%) scale(1)}100%{opacity:0;transform:translateY(-190%) scale(.95)}}
.exf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;margin-top:12px}
.exf button{height:40px;border-radius:20px;background:var(--fill);font-size:15px;font-weight:500;color:var(--ink)}
.exf button.red{color:var(--red)}
.donebtn{margin-top:18px;animation:pop .45s var(--pop) both}

/* descanso */
#rest{position:fixed;left:50%;bottom:calc(var(--sb) + 10px);z-index:30;display:flex;align-items:center;gap:18px;width:calc(100% - 20px);max-width:500px;padding:16px 18px;border-radius:36px;background:var(--sheetbg);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);box-shadow:inset 0 1px 0 var(--glhi),inset 0 0 0 .5px var(--line2),var(--glsh);transform:translate(-50%,170%);transition:transform .6s cubic-bezier(.2,1,.3,1),background .3s}
#rest:not(.on){visibility:hidden;transition:transform .6s cubic-bezier(.2,1,.3,1),background .3s,visibility 0s .6s}
#rest.on{transform:translate(-50%,0)}
#rest .rr{position:relative;width:84px;height:84px;flex-shrink:0}
#rest .rr svg{display:block;transform:rotate(-90deg)}
#rest .rr .tm{position:absolute;inset:0;display:grid;place-items:center;font:600 22px/1 var(--rd);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#rest .rc{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
#rest .lb{font-size:17px;font-weight:600}
#rest .sub{font-size:13px;color:var(--ink2);margin-top:1px}
#rest .ctl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
#rest .ctl button{height:36px;border-radius:18px;background:var(--fill);font-size:15px;font-weight:500}

#rest #rest-bar{transition:stroke-dashoffset .3s linear}
#rest.end{background:var(--accbg);color:#000}

#rest.end .ctl button{background:rgba(0,0,0,.12);color:#000}
#rest.end .ctl button.skip{background:#000;color:var(--accbg)}

body.resting #view{padding-bottom:calc(var(--sb) + 150px)}

/* pestañas */
#tabs{position:fixed;left:50%;bottom:calc(var(--sb) + 14px);z-index:20;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:300px;height:64px;margin-left:-150px;padding:5px;border-radius:32px;background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);box-shadow:inset 0 1px 0 var(--glhi),inset 0 0 0 .5px var(--line2),var(--glsh)}
#tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:27px;color:var(--ink2);font-size:10px;font-weight:600;letter-spacing:0;transition:background .3s,color .3s,transform .26s var(--pop)}
#tabs a:active{transform:scale(.94)}
#tabs a.on{background:var(--tabon);color:var(--acc)}
body.inworkout #tabs,body.inpreview #tabs,body.insum #tabs{display:none}

/* segmentado */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);height:32px;padding:2px;border-radius:9px;background:var(--fill);margin:0 0 16px}
.seg .th2{position:absolute;top:2px;bottom:2px;left:2px;border-radius:7px;background:var(--thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .36s cubic-bezier(.3,1.2,.5,1)}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:500;color:var(--ink)}
.seg button.on{font-weight:600}

/* progreso */
.streak{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:var(--r);background:var(--s1)}
.streak .h{display:flex;align-items:center;gap:8px;color:var(--or);font-size:15px;font-weight:600}
.streak .v{font-size:34px;line-height:38px;font-weight:600}
.streak .v small{font-size:17px;color:var(--ink2)}
.wk8{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.wk8 span{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--ink3);white-space:nowrap}
.wk8 i{display:block;width:100%;height:6px;border-radius:3px;animation:cell .38s var(--pop) both}
@keyframes cell{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:16px 0;border-radius:var(--r);background:var(--s1)}
.tri>div{display:flex;flex-direction:column;gap:2px;padding:0 14px;min-width:0}
.tri>div+div{box-shadow:inset .5px 0 0 var(--line)}
.tri .k{font-size:13px;color:var(--ink2)}
.tri .v{font-size:28px;line-height:34px;font-weight:600;white-space:nowrap}
.tri .v small{font-size:15px}
.hv{display:flex;flex-direction:column}
.hv .k{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--ink2)}
.hv .v{font-size:34px;line-height:40px;font-weight:600}
.hv .v small{font-size:17px;color:var(--ink2);font-family:-apple-system,system-ui,sans-serif;letter-spacing:-.01em}
.hv .d{font-size:13px;color:var(--ink2)}
.bars{position:relative;display:flex;height:132px;padding-right:22px;margin-top:12px}
.bars .bl{position:absolute;left:0;right:22px;bottom:0;height:.5px;background:var(--line)}
.bars .gl{position:absolute;left:0;right:22px;height:0;border-top:1px dashed color-mix(in srgb,var(--acc) 55%,transparent)}
.bars .gt{position:absolute;right:0;font-size:11px;color:var(--acc);font-family:var(--rd)}
.bars .zt{position:absolute;right:0;bottom:-6px;font-size:11px;color:var(--ink3);font-family:var(--rd)}
.bars button{position:relative;flex:1 1 0;height:100%;display:flex;align-items:flex-end;justify-content:center}
.bars button i{display:block;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--g2),var(--g1));transform-origin:bottom;animation:col .9s var(--spring) both;transition:opacity .24s,background .24s}
.bars button.on i{background:var(--ink)}
.bars.sel button:not(.on) i{opacity:.35}
.bars button.cur:not(.on) i{opacity:.5}
@keyframes col{from{transform:scaleY(0)}to{transform:none}}
.axis{display:flex;justify-content:space-between;padding-right:22px;margin-top:6px;font-size:11px;color:var(--ink3)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex-shrink:0;height:30px;padding:0 12px;border-radius:15px;background:var(--s2);font-size:13px;font-weight:600;transition:background .24s,color .24s}
.chips button.on{background:var(--ink);color:var(--bg)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:10px;background:var(--acc-soft);color:var(--acc);font-size:13px;font-weight:600}
.badge.flat{background:var(--fill);color:var(--ink2)}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s var(--spring) .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fadein{animation:fade .9s ease .5s both}
@keyframes fade{from{opacity:0}}
.popin{animation:pop .45s var(--pop) 1.2s both;transform-box:fill-box;transform-origin:center}
.heat{display:grid;grid-template-columns:14px repeat(12,minmax(0,1fr));gap:5px}
.heat span{aspect-ratio:1;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--ink3)}
.heat span.c{animation:cell .38s var(--pop) both}
.legend{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:12px;font-size:11px;color:var(--ink3)}
.legend i{width:10px;height:10px;border-radius:3px}
.split{display:flex;gap:2px;height:10px;margin-bottom:6px}
.split i{border-radius:0;transform-origin:left;animation:segx 1s var(--spring) .25s both}
.split i:first-child{border-radius:5px 0 0 5px}.split i:last-child{border-radius:0 5px 5px 0}.split i:only-child{border-radius:5px}
@keyframes segx{from{transform:scaleX(0)}}
.dot{width:10px;height:10px;border-radius:5px;flex-shrink:0}
.mbar{position:relative;height:8px;border-radius:4px;background:var(--gt);overflow:hidden;margin:10px 0}
.mbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--g1),var(--g2));transform-origin:left;animation:segx 1.1s var(--spring) .3s both}
.chart{position:relative;padding:16px;border-radius:var(--r);background:var(--s1)}
.chart svg{display:block;width:100%;height:auto;touch-action:none;overflow:visible}
.tip{position:absolute;top:10px;pointer-events:none;padding:6px 10px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;white-space:nowrap;transform:translateX(-50%);opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.empty{padding:28px 18px;border-radius:var(--r);background:var(--s1);color:var(--ink2);text-align:center;font-size:15px}

/* resumen */
.sumrings{position:relative;align-self:center;width:210px;height:210px;margin:6px auto 22px}
.sumrings:before{content:"";position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(closest-side,var(--gt),transparent)}
.sumttl{text-align:center;margin-bottom:22px}
.sumttl h1{font-size:28px;line-height:34px}
.sumttl p{margin:4px 0 0;font-size:15px;color:var(--ink2)}
.cmpbar{display:flex;gap:2px;height:8px;margin-bottom:14px}
.cmpbar i{transform-origin:left;animation:segx 1s var(--spring) .3s both}
.cmpbar i:first-child{border-radius:4px 0 0 4px}.cmpbar i:last-child{border-radius:0 4px 4px 0}.cmpbar i:only-child{border-radius:4px}
.arrow{font-weight:700;margin-left:6px}
.lg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lg3 b{display:block;font:600 22px/1.2 var(--rd)}
.lg3 span{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink2)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;max-width:62%}
.arrow.up{color:var(--acc)}.arrow.down{color:var(--amber)}.arrow.eq{color:var(--ink3)}

/* rutina y ajustes */
.rx .ib{width:34px;height:34px;border-radius:17px;display:grid;place-items:center;color:var(--ink2);flex-shrink:0}
.rx .ib:active{background:var(--s2)}
.rx .ib[disabled]{opacity:.25}
.srow2{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:60px;box-shadow:inset 0 -.5px 0 var(--line)}
.srow2:last-child{box-shadow:none}
.srow2 .t1{font-size:17px}
.srow2 .t2{font-size:13px;color:var(--ink2);margin-top:2px}
.btn{height:44px;padding:0 18px;border-radius:22px;background:var(--fill);font-weight:600;font-size:15px;color:var(--ink);transition:transform .2s var(--pop)}
.btn.pri{background:var(--accbg);color:#000}
.btn.danger{background:var(--red);color:#fff}
.btn:active{transform:scale(.96)}
.mini{display:grid;grid-template-columns:34px 48px 34px;align-items:center;gap:4px}
.mini button{width:34px;height:34px;border-radius:17px;background:var(--s2);font-size:18px;color:var(--ink2)}
.mini span{text-align:center;font-weight:600;font-family:var(--rd)}
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex-shrink:0;transition:background .3s}
.switch:after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .35s var(--pop)}
.switch.on{background:#34C759}
.switch.on:after{transform:translateX(20px)}
.steps{margin:10px 0 4px;padding-left:20px;color:var(--ink2);font-size:14px;line-height:1.45}
.steps b{color:var(--ink)}

/* hoja inferior */
#sheet{position:fixed;inset:0;z-index:40}
#sheet .bd{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .35s}
#sheet .pn{position:absolute;left:50%;bottom:0;width:100%;max-width:520px;max-height:88%;overflow-y:auto;overscroll-behavior:contain;transform:translate(-50%,100%);transition:transform .5s cubic-bezier(.2,1,.3,1);border-radius:28px 28px 0 0;background:var(--s1);padding:8px 16px calc(var(--sb) + 18px)}
#sheet.on .bd{opacity:1}
#sheet.on .pn{transform:translate(-50%,0)}
#sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--s3);margin:0 auto 14px}
#sheet h3{margin:4px 0 6px;font-size:22px;font-weight:700}
#sheet p{margin:0 0 14px;color:var(--ink2);font-size:15px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.acts .btn{height:50px;border-radius:25px;font-size:17px}
.fld{display:block;margin-top:12px}
.fld>span{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px}
.fld input[type=text]{width:100%;height:48px;border-radius:12px;border:0;background:var(--s2);color:var(--ink);padding:0 14px;font:500 17px -apple-system,system-ui,sans-serif}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box2{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:var(--s2);margin-top:10px}
.pick{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 4px;text-align:left;font-size:17px}
.srch{position:sticky;top:-8px;z-index:3;box-shadow:0 -12px 0 var(--s1);width:100%;height:40px;border-radius:12px;border:0;background:var(--fill);color:var(--ink);padding:0 14px;font:400 17px -apple-system,system-ui,sans-serif;margin:4px 0 8px;-webkit-appearance:none;appearance:none}
.srch::placeholder{color:var(--ink2)}
.grp{margin-top:4px}
.grph{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 4px;font-size:17px;font-weight:700}
.grph small{font-size:13px;font-weight:500;color:var(--ink2);margin-left:6px}
.chev{flex-shrink:0;transition:transform .45s var(--spring);color:var(--ink3)}
.grp.open>.grph .chev{transform:rotate(180deg)}
.grpb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--spring)}
.grp.open>.grpb{grid-template-rows:1fr}
.grpb>div{min-height:0;overflow:hidden}
.pki{border-radius:14px;background:var(--s2);margin-bottom:6px;overflow:hidden}
.pkh{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px 8px 8px;text-align:left;font-size:15px;font-weight:600}
.pkh .th{width:52px;height:40px;border-radius:9px}
.pkh .nm{flex:1;min-width:0;line-height:1.2}
.pkh .tag{font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em}
.pki .pkb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--spring)}
.pki.open .pkb{grid-template-rows:1fr}
.pki.open .chev{transform:rotate(180deg)}
.pkb>div{min-height:0;overflow:hidden}
.pkin{padding:0 10px 10px}
.ph{position:relative;border-radius:12px;overflow:hidden;background:#fff;aspect-ratio:4/3}
.ph .f{position:absolute;inset:0;background-repeat:no-repeat}

.pkadd{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;margin-top:8px;border-radius:23px;background:var(--accbg);color:#000;font-weight:600;font-size:17px}

.gobar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:30px 16px calc(var(--sb) + 14px);background:linear-gradient(180deg,transparent,var(--bg) 42%)}

.gobtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:28px;background:var(--accbg);color:#000;font-size:19px;font-weight:600;box-shadow:0 12px 30px -12px color-mix(in srgb,var(--accbg) 70%,transparent);transition:transform .2s var(--pop)}
.gobtn:active{transform:scale(.96)}
.gobtn:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sweep 3.6s ease-in-out 1s infinite}
@keyframes sweep{0%{left:-40%}35%,100%{left:130%}}

#launch{position:fixed;inset:0;z-index:70;pointer-events:none;display:grid;place-items:center}
#launch .lc{position:fixed;left:var(--lx);top:var(--ly);width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--lc);transform:scale(0);transition:transform .62s cubic-bezier(.7,0,.3,1)}
#launch.on .lc{transform:scale(160)}
#launch .lt{position:relative;text-align:center;color:#000;opacity:0;transform:scale(.8);transition:opacity .3s ease .28s,transform .5s var(--pop) .28s}
#launch.on .lt{opacity:1;transform:none}
#launch .lt b{display:block;font-size:44px;font-weight:800;letter-spacing:-.03em}
#launch .lt span{font-size:17px;font-weight:600;opacity:.7}
#launch.out{opacity:0;transition:opacity .4s ease}

#toast{position:fixed;left:50%;top:calc(var(--st) + 10px);z-index:60;transform:translate(-50%,-180%);transition:transform .45s cubic-bezier(.2,1,.3,1);padding:11px 18px;border-radius:22px;background:var(--sheetbg);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--line2),var(--glsh);color:var(--ink);font-weight:600;font-size:15px;max-width:90%}
#toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*,*:before,*:after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
</style>

      ask('¿Cargar esta copia?', d.sessions.length + ' entrenos. Sustituye lo que hay ahora en este móvil.', 'Cargar', true, function () { S = d; save(); render(); toast('Copia cargada'); });
    } catch (e) { toast('Ese archivo no es una copia válida'); }
  };
  rd.readAsText(f); this.value = '';
});

/* ---------- arranque ---------- */
render();
tickRest();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
