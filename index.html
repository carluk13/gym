/* Settings part of the model cache key */
function cfSetKey(e) { return [e.min, e.max, e.sets, e.rest, e.wu, e.step, e.inc, e.bar, e.asis, e.tp, e.img, e.lb, S.bw, S.fb].join('|'); }

/* Everything the coach knows about an exercise: settings, bounded history, structure of each exposure, fatigue profile,
   slope, exposures read by the model (ex) and the ones it trusts (xs: typo sessions out). Cached on the core's history */
function cfModel(id) {
  var h = exHist(id), e0 = (S.ex && S.ex[id]) || EX_DEF[id] || {}, key = cfSetKey(e0), c = CF_MEMO.m[id], m, f, e, mn, mx, n, rest, st, bw, hh, amax = 0, t, sure;
  if (c && c.h === h && c.key === key) return c.m;

  mn = num(e.min); mx = num(e.max); n = num(e.sets); rest = num(e.rest); st = exStep(id); bw = num(S.bw);
  mn = mn > 0 ? Math.max(1, Math.round(mn)) : 8;

  if (mx < mn) { t = mn; mn = mx; mx = t; }                     // a swapped range (12-8) is read as 8-12
  n = n >= 1 ? Math.min(8, Math.round(n)) : 3;

  hh.forEach(function (x) { x.all.forEach(function (s) { if (s.kg > amax) amax = s.kg; }); });
  m = { id: id, info: f, e: e, kind: f.kind, asis: f.asis, secs: f.secs, min: mn, max: mx, n: n, rest: rest > 0 ? rest : 90,
        step: st > 0 ? st : 2.5, lo: f.asis ? 0 : f.bar, hist: hh, a0: 30, rmid: (mn + mx) / 2, lb: coreLbModel(id) ? coreLbModel(id).st : 0 };

  m.a = m.a0;
  m.ex = [];
  hh.forEach(function (x, i) {
    var back = !(x.ef >= 1 && x.ef <= 3) && i > 0 && dayDiff(hh[i - 1].t, x.t) >= CF.gap, rir = cfRir(m, x.ef, back), an = cfAnchor(m, x, rir, m.ex.length ? m.ex[m.ex.length - 1].an : null);
    if (an) m.ex.push({ t: x.t, h: x, an: an, L0: an.L0, E0: an.E0, r1: an.r1, ef: x.ef, rir: rir, back: back, e1r: an.e1r });

    var v = [], j, md;

/* Capacity from the last exposures of xs (chronological): { e1, used, mean }. Recency-weighted mean of the last 3 (a bad day is

    if (xs[i].e1 > 0) used.push(xs[i]);

/* Predicted set-1 target (whole reps, 0.5 in reserve) at kg from capacity e1 */
function cfP(m, e1, kg) { return cfR(cfPred(m, e1, kg) - CF.rirT); }

/* Top-set climb at the current top load: { n, first, prev } when the last exposures, consecutive and at the same top load,
   all had a top set followed by his back-offs at a lighter load; else null */
function cfClimb(m, xs) {
  var i = xs.length - 1, L = xs[i].L0, c = 0, first = null;
  for (; i >= 0 && cfSame(xs[i].L0, L) && xs[i].an.topBo; i--) { c++; first = xs[i]; }
  return c ? { n: c, first: first, prev: c > 1 ? xs[xs.length - 2] : null } : null;
}

/* ---------- decisions ---------- */

/* Going heavier from exposure last (capacity e1, history xs): straight to the next load when its predicted set 1 reaches min,
   else a top-set climb when it is close enough, else reps (bridge up to max + 3), else 'far' (a weight in between is missing).
   { st: 'up' | 'reps' | 'far', L, L1, p1, pct, code, t1, bo } */
function cfUp(m, last, e1, xs) {
  var L0 = last.L0, r1 = last.r1, L1 = cfMove(m, L0, 1), L2, p1, pct, big, L, lim, capN = 0, i, two = false, kn;
  if (cfSame(L1, L0)) return { st: r1 >= m.max + CF.bridge ? 'far' : 'reps', L: L0, L1: L0, p1: null, pct: 0, code: 'nomove' };
  p1 = cfP(m, e1, L1); pct = cfPct(m, L0, L1);
  kn = cfFailAt(m, xs, L1, last.t);
  if (kn && kn.p < p1) { p1 = kn.p; kn = kn.did; } else kn = null; // he already fell short there recently: believe it
  big = (m.kind === 'is' || m.kind === 'ab') && pct > CF.bigIso + 1e-9;   // loaded abs machines are isolation too (verification)
  if (p1 >= m.min && (!big || p1 >= m.min + 1 || r1 >= m.max + 2)) {
    L = L1; L2 = cfMove(m, L0, 2);
    if (!big && r1 > m.max && !cfSame(L2, L1) && cfPct(m, L0, L2) <= CF.two + 1e-9 && cfP(m, e1, L2) >= m.max - 1) { L = L2; two = true; }
    lim = r1 - (cfPct(m, L0, L) > CF.firstPct + 1e-9 ? 2 : 1) - (last.ef === 3 ? 1 : 0);   // never as many reps at a heavier load
    return { st: 'up', L: L, L1: L1, p1: p1, pct: pct, code: two ? 'two' : 'up', t1: cfClamp(Math.min(cfP(m, e1, L), lim), 1, m.max) };
  }
  for (i = xs.length - 1; i >= 0 && cfSame(xs[i].L0, L0) && xs[i].r1 >= m.max + CF.bridge && !xs[i].an.topBo; i--) capN++;
  if ((r1 > m.max && p1 >= m.min - 1) || (r1 >= m.max + CF.bridge && p1 >= m.min - CF.climbMin) || (capN >= 2 && p1 >= m.min - CF.climbLate))
    return { st: 'up', L: L1, L1: L1, p1: p1, pct: pct, code: 'climb', t1: cfClamp(p1, 1, m.max), bo: 'force' };
  if (r1 >= m.max + CF.bridge) return { st: 'far', L: L0, L1: L1, p1: p1, pct: pct, fail: kn, code: kn != null ? 'fail' : p1 >= m.min - CF.climbLate ? 'wait' : 'far' };
  i = cfP(m, Math.max(e1, cfE1(m, L0, m.max + CF.bridge + CF.cens + CF.censCap)), L1);   // even at max + 3 here: would the next load ever be in reach?
  return { st: 'reps', L: L0, L1: L1, p1: p1, pct: pct, fail: kn, code: kn != null ? 'fail' : i < m.min - CF.climbLate ? 'ahead' : big ? 'big' : 'guard' };
}

/* Best set 1 he managed at load L in the last 42 days, when it was under min (a failed jump or top set): { did, p } with p = did,
   plus 1 after 21 days; null when there is none. p caps the predicted set 1 at L so the same jump is not retried straight away */
function cfFailAt(m, xs, L, t) {
  var best = null, when = 0;
  xs.forEach(function (x) {
    var d = dayDiff(x.t, t), r = null;
    if (d > CF.failMem || x.back) return;
    if (cfSame(x.L0, L)) r = x.r1;
    if (r != null && (best == null || r > best)) { best = r; when = d; }
  });
  if (best == null || best >= m.min) return null;
  return { did: best, p: best + (when >= CF.failDays ? 1 : 0) };

/* Break from THIS exercise (21 days or more): one gentle session (C). 21-34 days same load and 2 reps under; 35-59 -15 %;
   60 or more -30 % with comfortable sets; loads rounded to the easier side; never sticky. Two guards (verification):
   a coarse step that would cut far more than the tier takes the next load up, or keeps the load and eases the reps
   (15 kg to 10 kg is -33 %, not -15 %); and when last time was already short (the gentle set 1 would fall under min - 2) the
   session goes up to 3 steps lighter (third verification: more fine steps while within 20 % of last time's load, so 5 kg
   steps on a 240 kg leg press can still get there), to the first load where it reaches min - 2, instead of asking for 1 or 2 reps.
   At the same load (21-34 days), his own lighter sets of last time stay at their load (cfSets, o.backRef) */

             : Math.max(1, Math.min(cfP(m, d.e1, x), cfSame(x, L0) ? last.r1 : m.max, m.max) - d.ease);
  };
  if (b) {
    L = cfLoadAt(m, last.E0 * (1 - CF.brkCut[b]), -1);
    if (L == null || !cfHarder(m, L0, L)) L = cfMove(m, L0, -1);
    for (i = 0; i < 4 && cfHarder(m, L0, L) && cfPct(m, L0, L) > CF.brkCut[b] * CF.brkOver + 1e-9; i++) {   // coarse step: next load up
      y = cfMove(m, L, 1);
      if (!cfHarder(m, y, L)) break;
      L = y;
    }
  }
  d.t1 = tAt(L);

    y = cfMove(m, Lx, -1);                                         // (3 steps, or more fine steps within 20 % of last time's load)
    if (!cfHarder(m, Lx, y) || (i > 3 && cfPct(m, L0, y) > CF.shortCut + 1e-9)) break;

  return d;
}

/* Climb back after a break (A): the comeback (21+ days after the session before) is one of the last 3 exposures and he is still
   lighter than before the break. Halfway first (35+ days and 2 or more steps away), then the load before the break,
   each only where the predicted set 1 reaches min + 1 (else a step less). The prediction uses at least the capacity before
   the break, decayed by the tier (verification: the comeback's easy, capped sets under-read it, and on a coarse stack the
   coach otherwise stayed at the lighter load for weeks with "falta un peso intermedio"). Set 1 at most one rep under the
   comeback's set 1 (never as many reps at a heavier load). A top-set climber whose comeback was all on his back-off load gets
   his top set back (at most his reps there before the break, back-offs where he is). Fills d and returns true, else false */
function cfReturn(m, d) {

  if (n < 2 || last.r1 < m.min) return false;

  first = !!pre && last.back;

  for (i = j + 2; i < n; i++) if (!cfHarder(m, pre.L0, xs[i].L0)) return false;          // already back there once (j is pre's index)
  g = dayDiff(pre.t, xs[j + 1].t);

  if (pre.an.topBo && cfSame(last.L0, pre.an.boKg)) {              // a top-set climber came back on his back-off load: his top set again
    p = cfP(m, e1, pre.L0);

  }

  if (first && cfSteps(m, Lt, last.L0) >= 2 && dayDiff(pre.t, last.t) >= CF.brk[1]) {
    mid = cfLoadAt(m, (last.E0 + pre.E0) / 2, -1);
    if (mid == null || !cfHarder(m, mid, last.L0)) mid = cfMove(m, last.L0, 1);
    if (cfHarder(m, Lt, mid)) Lt = mid;

  d.t1 = cfClamp(Math.min(cfSame(Lt, pre.L0) ? Math.min(p, Math.max(pre.r1, m.min)) : p, Math.max(m.min, last.r1 - 1)), 1, m.max);

}

/* Down after a miss. Back to the hardest load he managed (set 1 at min or more) in the last 42 days, within 3 steps, with what
   he did there (B); else the first lighter load (up to 3 steps) whose predicted set 1 is min + 0.5 or more. A falling top-set
   climb starts that search at its back-off load (up to 2 steps under it: the back-offs may have collapsed too) */
function cfDown(m, d) {
  var xs = m.xs, last = d.last, L0 = last.L0, known = null, i, x, L = L0, fx = [], k, s, n;
  for (i = xs.length - 2; i >= 0; i--) {
    x = xs[i];
    if (dayDiff(x.t, last.t) > CF.win) break;
    if (cfHarder(m, L0, x.L0) && x.r1 >= m.min && !x.back && !x.an.topBo && cfSteps(m, x.L0, L0) <= 3 && (!known || cfHarder(m, x.L0, known.L0))) known = x;
  }

    x = last.an.topBo && d.climb && cfHarder(m, L0, last.an.boKg) ? last.an.boKg : L0;
    n = x === L0 ? 3 : 2;
    for (i = x === L0 ? 1 : 0; i <= n; i++) { L = i ? cfMove(m, x, -i) : x; if (cfPred(m, d.e1, L) - CF.rirT >= m.min + 0.5) break; }
  }

    d.fixed = fx;

}

/* Stall at the current load (reactive, no calendar): { n } or null. Needs 6 or more counted exposures at this load (the jump

   total reps in the last 5 of them, and a fitted e1 gain under 2.5 % across them (least squares on the log, so one noisy
   session cannot decide) */

    if (!x.an.asc) run.unshift(x);
  }
  if (i >= 0 && run.length && cfHarder(m, L, xs[i].L0) && dayDiff(xs[i].t, run[0].t) < CF.brk[1]) run.shift();   // the jump session
  else if (i < 0 && run.length && run[0] === xs[0] && xs.length >= CF.hist) run.shift();

  if (rec > best) return null;
  best = rec = 0;                                                  // nor a record of total reps at this load (a met micro-goal is progress)
  for (j = 0; j < k; j++) {
    b = 0; run[j].an.struct.slice(0, m.n).forEach(function (x) { if (cfSame(x.kg, L)) b += x.reps; });
    if (j < k - CF.stallRec) best = Math.max(best, b); else rec = Math.max(rec, b);
  }
  if (rec > best) return null;
  for (j = 0; j < k; j++) { b = Math.log(run[j].e1); sx += j; sy += b; sxx += j * j; sxy += j * b; }
  b = (k * sxy - sx * sy) / (k * sxx - sx * sx);

}

/* True when an earlier exercise of today's day (ctx.day or the active workout's day) already offers a reset: one offer per day */
function cfResetTaken(id, ctx) {
  var did = ctx && (ctx.day || (ctx.active && ctx.active.day)), day = null, i, o;
  if (!did || !Array.isArray(S.days)) return false;
  S.days.forEach(function (x) { if (x && x.id === did) day = x; });
  if (!day || !Array.isArray(day.ex) || day.ex.indexOf(id) < 0) return false;
  for (i = 0; i < day.ex.indexOf(id); i++) {
    o = cfPlanCore(day.ex[i], { now: ctx.now, active: null, noAlt: false });
    if (o && o.flags && o.flags.alt) return true;
  }
  return false;
}

/* Today's decision: { st, L, t1, ease, capK, floor, bo, code, ... } from breaks, the climb back, misses, the set-1 trigger and the hold */
function cfDecide(m, ds) {

      L0 = last.L0, r1 = last.r1, d = { cap: cap, e1: e1, last: last, prev: prev, ds: ds, ease: 0, bo: 'auto', L: L0, code: null },
      pv, pj, cl, up, aim, best, hi, lo, t1, pre;
  d.pred0 = cfPred(m, e1, L0);
  if (ds >= CF.brk[0]) return cfBreak(m, d);
  if (cfReturn(m, d)) return d;
  pv = prev && dayDiff(prev.t, last.t) < CF.brk[1] && !last.back ? prev : null;
  d.jumped = !!(pv && cfHarder(m, L0, pv.L0));
  if (d.jumped) {                                                  // grace (B): a jump that landed close to its prediction is not a miss, but
    pj = cfP(m, cfCap(m, xs.slice(0, n - 1)).e1, L0);              // only a jump the coach could have proposed (verification: a jump of his own
    d.grace = r1 < m.min && (last.an.topBo                         // to 1-3 reps is a miss). pj is recomputed with the slope relearned from it: 1 rep of slack
      ? r1 >= pj - CF.climbGrace && pj >= m.min - CF.climbLate - 1 && r1 > Math.max(1, m.min - 5)   // top set: the climb's own floor
      : r1 >= pj - CF.grace && pj >= m.min - CF.grace);

    d.climb = cl;

  }

    d.miss = r1 <= m.min - CF.missBig ? 'big' : 'two';             // heuristics: one big miss, or two in a row without improving
    if (cfDown(m, d)) return d;

  }
  if (r1 >= m.max || (last.ef === 1 && r1 >= m.max - 1)) {         // the set-1 trigger, guarded at the next load
    up = cfUp(m, last, e1, xs); d.up = up; d.code = up.code;
    if (up.st === 'up') { d.st = 'up'; d.L = up.L; d.t1 = up.t1; d.bo = up.bo || 'auto'; d.capK = m.max; return d; }
    d.far = up.st === 'far';
  }
  d.push = last.ef === 3 || d.far ? 0 : CF.push;                    // al límite: no extra reps; far: no more reps
  aim = d.pred0 + d.push - CF.rirT; d.aim = aim;
  best = r1;                                                       // beat last time, at most one rep over his best recent set 1 here
  cap.used.forEach(function (x) { if (cfSame(x.L0, L0) && x.r1 > best && !x.back) best = x.r1; });
  hi = d.push ? Math.max(r1 + 1, best) : Math.max(r1, d.far ? r1 : best);
  lo = Math.min(r1, m.max + CF.bridge);
  t1 = cfClamp(cfR(aim), lo, hi);
  if (r1 >= m.max && !d.far) { d.st = 'reps'; t1 = Math.min(Math.max(t1, r1 + 1), m.max + CF.bridge); }
  else { d.st = 'hold'; t1 = Math.min(t1, d.far ? m.max + CF.bridge : m.max); }
  pre = last.back && prev && cfSame(prev.L0, L0) && !d.far ? prev : null;   // the session after a comeback at the same load: as before the break
  if (pre && pre.r1 > t1 && pre.r1 <= m.max && cfP(m, Math.max(e1, cfCap(m, xs.slice(0, n - 1)).e1 * CF.brkDecay[0]), L0) >= pre.r1 - 1) { t1 = pre.r1; d.retSame = pre; }
  if (r1 < m.min && !d.climbP && !d.grace) {                       // one small miss: repeat the load, aim at min, at most 2 over last time
    if (!d.miss && !d.improving) d.miss = 'one';
    t1 = Math.min(Math.max(t1, m.min), r1 + CF.missPlus);
  }
  d.L = L0; d.t1 = Math.max(1, t1); d.floor = true; d.capK = m.max + CF.bridge;
  if (d.st === 'hold' && !d.miss && !d.climbP && !d.far && !last.an.topBo && r1 < m.max - 1 && !d.retSame) d.stall = cfStall(m, d);
  return d;
}

/* Per-set targets from set 1 (load o.L, target o.t1) for the decision d. Later sets follow his fatigue profile at the same
   capacity and never rise across sets at one load. Hold days (o.floor): each set at last time's load is anchored to last time's
   set with the same index (never fewer reps, at most one more; a set missing on a rushed day comes from the exposure before);
   his own back-off structure is kept while a set at the top load would be borderline; an automatic back-off only when last
   time's set already fell under min - 0.5 and one more rep would not fix it (in two sessions running, or by 3 reps). Jump days:
   never as many reps as last time at the lighter load; a back-off by Carlos's rule or his own offset. o.bo 'force' (climb
   start): later sets at the old load. o.keep (far tier): set 1 stays, later sets gain one rep. o.fixed: exact targets.
   o.backRef (21-34 days off at the same load; second verification): no later set further under last time's than set 1 is
   (o.backDrop, 2 reps unless the model asks less in set 1), as the why says "2 reps menos" (the to-failure profile on top of
   the 2 reps of margin asked for 3 to 5 fewer in the later sets: 10 9 8 gave 8 6 5, now 8 7 6), and his own lighter sets keep
   their load (third verification: 30 x 8 6 5 6 + 25 x 8 gave 30 x 6 4 3 3 2, now 30 x 6 4 3 3 + 25 x 6). After a comeback session
   (last.back: its sets were eased on purpose) no automatic back-off comes from its low later sets, and with o.pre (set 1 back to
   the session before the break, d.retSame) the later sets also aim at what he did there: never sticky */
function cfSets(m, o, last, prev2) {
  var out = [], R1 = Math.max(o.t1 + CF.rirT + (o.ease || 0), o.R1 || 0), e1i = cfE1(m, o.L, R1), bo = null, pr = null, fb = cfFb(),
      st = last ? last.an.struct : [], ps = prev2 ? prev2.an.struct : [], k, Lk, aim, r, lw, lwo, lb, pct, ok, off, own, one = cfMove(m, o.L, -1),
      eased = !!(o.floor && last && last.back), x, br;
  function at(L) { return cfPred(m, e1i, L) * cfF(m, k) - CF.rirT - (o.ease || 0); }
  for (k = 0; k < m.n; k++) {
    if (k === 0) { Lk = o.L; r = o.t1; }
    else if (o.fixed && o.fixed[k] != null) { Lk = o.L; r = Math.max(1, Math.min(o.fixed[k], pr.reps)); }
    else {
      Lk = bo != null ? bo : o.L;
      if (o.bo === 'force' && bo == null && last && cfHarder(m, o.L, last.L0)) { bo = last.L0; Lk = bo; }
      br = o.backRef ? o.backRef[k] : null;                         // gentle session at the same load: his own lighter set stays at its load
      if (bo == null && br && fb !== 'same' && cfHarder(m, o.L, br.kg) && cfPct(m, o.L, br.kg) <= CF.ownBoMax + 1e-9) { bo = br.kg; Lk = bo; }
      aim = at(Lk);
      own = st[k] && cfHarder(m, last.L0, st[k].kg) && cfHarder(m, o.L, st[k].kg) && cfPct(m, o.L, st[k].kg) <= CF.ownBoMax + 1e-9 &&
            (fb === 'drop' || cfPct(m, o.L, st[k].kg) >= CF.boStep - 1e-9) ? st[k].kg : null;   // a lighter set under 8 % merges back (his 'lo más eficaz')
      if (bo == null && own != null && o.bo !== 'none' && fb !== 'same' && (o.floor || o.up) && aim < m.min + 0.5) { bo = own; Lk = bo; aim = at(Lk); }
      lwo = st[k] && cfSame(st[k].kg, o.L) ? st[k].reps : null;      // last time's set k at the top load
      if (bo == null && o.bo !== 'none' && fb !== 'same' && !cfSame(one, o.L)) {
        pct = cfPct(m, o.L, one);
        off = o.up && last ? cfHisOff(m, last, k) : 0;
        ok = pct <= CF.boMax + 1e-9 && (fb === 'drop' || pct >= CF.boStep - 1e-9 || off > 0);
        if (o.floor) ok = ok && !eased && lwo != null && lwo + (o.push === 0 ? 0 : 1) < m.min - 0.5 && (lwo <= m.min - 3 ||
                          (!!prev2 && cfSame(prev2.L0, last.L0) && (!ps[k] || ps[k].reps < m.min - 0.5 || cfHarder(m, last.L0, ps[k].kg))));   // short twice, or by 3
        else ok = ok && aim < m.min - 0.5;
        if (ok) {
          lb = off > 0 ? cfLoadAt(m, cfEff(m, o.L) - off, 0) : one;
          if (lb == null || !cfHarder(m, o.L, lb) || cfPct(m, o.L, lb) > CF.ownBoMax + 1e-9) lb = one;
          bo = lb; Lk = bo; aim = at(Lk);
        }
      }
      r = cfR(aim);
      lw = st[k] && cfSame(st[k].kg, Lk) ? st[k].reps : null;
      if (o.floor) {
        if (lw == null && ps[k] && cfSame(ps[k].kg, Lk) && cfSame(prev2.L0, last.L0)) lw = ps[k].reps;   // rushed day: the session before
        x = o.pre ? o.pre.an.struct[k] : null;
        if (x && cfSame(x.kg, Lk) && x.reps <= m.max) lw = Math.max(lw == null ? 0 : lw, x.reps);    // after the comeback: as before the break
        if (lw != null) r = o.keep ? Math.min(lw + 1, m.max + CF.bridge) : cfClamp(r, lw, lw + (o.push === 0 ? 0 : 1));   // far tier: set 1 stays, later sets gain
      } else if (o.up && st[k] && cfHarder(m, Lk, st[k].kg)) r = Math.min(r, st[k].reps - 1);   // fewer reps at a heavier load
      else if (o.bo === 'force' && lw != null) r = Math.min(r, lw + 1);
      if (o.backRef && o.backRef[k] && cfSame(o.backRef[k].kg, Lk)) r = Math.max(r, o.backRef[k].reps - o.backDrop);   // gentle session: his own drop from set 1
      if (o.missCap && lw != null) r = Math.min(r, lw + CF.missPlus);
      if (pr && cfSame(pr.kg, Lk)) r = Math.min(r, pr.reps);
      if (o.capK) r = Math.min(r, o.capK);
      if (bo != null) r = Math.min(r, m.max);                       // a lighter set stays inside the range
      r = Math.max(1, r);
    }
    pr = { kg: Lk, reps: Math.max(1, r) };
    out.push(pr);
  }
  return out;
}

/* His own back-off at structure set k last time: the effective kg he took off, or 0 */
function cfHisOff(m, last, k) {
  var x = last.an.struct[k];
  return x && cfHarder(m, last.L0, x.kg) && cfPct(m, last.L0, x.kg) <= CF.ownBoMax + 1e-9 ? last.E0 - cfEff(m, x.kg) : 0;
}

/* The micro-goal of a stall (B): the best of his last two sessions at this load set by set, one rep more on the weakest set
   that can take it without rising over the set before (else on set 1) */
function cfMicro(m, last, prev2) {
  var s = last.an.struct.slice(0, m.n), p = prev2 && cfSame(prev2.L0, last.L0) ? prev2.an.struct : [], fx = [], w = 0, lo = Infinity, k;
  s.forEach(function (x, i) { fx.push(cfSame(x.kg, last.L0) ? Math.min(m.max, Math.max(x.reps, p[i] && cfSame(p[i].kg, x.kg) ? p[i].reps : 0)) : null); });
  for (k = 1; k < fx.length; k++) if (fx[k] != null && fx[k - 1] != null && fx[k] > fx[k - 1]) fx[k] = fx[k - 1];
  for (k = fx.length - 1; k >= 1; k--) if (fx[k] != null && fx[k] + 1 <= fx[k - 1] && fx[k] < lo) { lo = fx[k]; w = k; }
  if (fx[w] != null) fx[w] = Math.min(m.max, fx[w] + 1);
  while (fx.length < m.n) fx.push(null);
  return { fixed: fx, k: w };
}

/* Progress to the next load, in set-1 terms (the decision rule): { done, need, txt, kg, next, left, ready, bridge, set1 }.
   need = the first set-1 reps at today's load that make the same decision code go heavier next time (simulated through
   cfUp with today's other targets); null when no reps can (a weight in between is missing) */
function cfToNext(m, d, work, now) {
  var last = d.last, L0 = d.L, L1 = cfMove(m, L0, 1), r, hyp, an, x, xs, up, need = null, done, txt, verb, sets, R, k;
  if (!(d.st === 'hold' || d.st === 'reps') || !cfSame(last.L0, L0)) return null;
  done = last.r1;
  if (cfSame(L1, L0)) return { done: done, need: null, kg: L0, next: null, left: null, ready: false, bridge: false, set1: true,
                               txt: m.asis ? 'Ya sin asistencia: progresa con reps' : 'Sin más peso aquí: progresa con reps' };
  if (work.length > 1 && cfHarder(m, L0, work[1].kg)) {           // one top set: next milestone is set 2 joining the top load
    R = Math.ceil((m.min + 0.5 + CF.rirT) / cfF(m, 1) - CF.rirT);
    return { done: done, need: R, kg: L0, next: L0, left: Math.max(0, R - done), ready: done >= R, bridge: false, set1: true,
             txt: cfFit('Serie top: ' + done + ' de ' + R + ' reps para hacer más series con ' + fk(L0) + ' kg', 'Serie top: ' + done + ' de ' + R + ' reps') };
  }
  for (r = m.max; r <= m.max + CF.bridge && need == null; r++) {
    sets = work.map(function (w, i) { return { kg: w.kg, reps: !i ? r : cfSame(w.kg, L0) ? Math.max(w.reps, cfR((r + CF.rirT) * cfF(m, i) - CF.rirT)) : w.reps }; });
    hyp = { t: now, work: sets, warm: [], all: sets, ef: null };
    an = cfAnchor(m, hyp, CF.rirEf[0]);
    if (!an) break;
    x = cfExpo(m, hyp, an, cfRir(m, null, false), false);
    xs = m.xs.concat([x]);
    up = cfUp(m, x, cfCap(m, xs).e1, xs);
    if (up.st === 'up' || up.code === 'wait') { need = r; d.nextUp = up.st === 'up' ? up : null; d.nextX = x; d.nextTop = up.code !== 'up' && up.code !== 'two'; }
  }
  if (need == null) {
    return { done: done, need: null, kg: L0, next: L1, left: null, ready: false, bridge: true, set1: true,
             txt: done >= m.max + CF.bridge ? 'Al tope de reps: para subir falta un peso intermedio'
                : cfFit('Sigue sumando reps; para pasar de ' + fk(L0) + ' kg falta un peso intermedio', 'Sigue sumando reps; para subir falta un peso intermedio') };
  }
  verb = d.nextTop ? 'la serie top con ' + cfKg(m, L1) : m.asis ? 'bajar a ' + cfKg(m, L1) : 'subir a ' + fk(L1) + ' kg';
  k = Math.max(0, need - done);
  txt = work[0].reps >= need ? cfFit('Si haces ' + need + ' en la 1.ª hoy, ' + (d.nextTop ? 'la próxima va ' + verb.replace('la serie top', 'una serie top') : m.asis ? 'bajas a ' + cfKg(m, L1) : 'subes a ' + fk(L1) + ' kg'),
                                    'Si haces ' + need + ' en la 1.ª hoy, la próxima ' + (m.asis ? 'bajas la ayuda' : 'subes'))
                             : cfFit('Primera serie: ' + done + ' de ' + need + ' reps para ' + verb, 'Primera serie: ' + done + ' de ' + need + ' reps para ' + (m.asis ? 'bajar' : 'subir'));
  return { done: done, need: need, kg: L0, next: L1, left: k, ready: k === 0, bridge: need > m.max, set1: true, txt: txt };
}

/* ---------- warm-ups ---------- */

/* Muscle state today from the active workout: { st: 'warm' | 'cold', by: name, first } . Warm when another exercise with a done set
   already worked one of its primary groups (isolation: also as a synergist). first: no barbell or leg compound done yet today */
function cfMuscle(id, act) {
  var me = exInfo(id), P = me.prim, by = null, first = true;
  if (!act || !Array.isArray(act.items)) return { st: 'cold', by: null, first: true };
  act.items.forEach(function (it) {
    var o, hit;
    if (!it || it.ex === id || !Array.isArray(it.sets)) return;
    if (!it.sets.some(function (s) { return s && s.done && num(s.reps) > 0; })) return;
    o = exInfo(it.ex);
    if (o.kind === 'bb' || (o.kind === 'mc' && o.prim.some(function (g) { return g === 'Cuádriceps' || g === 'Femoral y glúteo'; }))) first = false;
    hit = o.prim.some(function (g) { return P.indexOf(g) >= 0; }) || (me.kind === 'is' && o.sec.some(function (g) { return P.indexOf(g) >= 0; }));
    if (hit && !by) by = o.n;
  });
  return { st: by ? 'warm' : 'cold', by: by, first: first };
}

/* His warm-up habit on this exercise from the last 5 exposures: { does, learned, ratio, reps, c, n, never } or null without history.
   learned: 2 or more of them had a warm-up, so ratio (median of its effective load over that session's top working load) and reps
   (median) are his own; does: half of them or more had one (compulsory set). never: the last 3 or more sessions were typed by v9+
   (wv) and none had a warm-up; legacy sessions never mean "never" */
function cfHabit(m) {
  var h = m.hist.slice(-CF.wuN), c = 0, rs = [], rp = [], typed = 0, learned;
  if (!h.length) return null;
  h.forEach(function (x) {
    if (x.sess && x.sess.wv) typed++;
    if (!x.warm.length || !x.work.length) return;
    var lw = x.warm[x.warm.length - 1], top = x.work[0].kg, E;
    x.work.forEach(function (s) { if (cfHarder(m, s.kg, top)) top = s.kg; });
    E = cfEff(m, top);
    c++;
    if (E > 0) rs.push(cfEff(m, lw.kg) / E);
    rp.push(lw.reps);
  });
  learned = c >= CF.wuLearn;
  return { does: learned && c / h.length >= CF.wuDoes - 1e-9, learned: learned,
           ratio: learned && rs.length ? cfClamp(coreMed(rs), CF.wuRatio[0], CF.wuRatio[1]) : null,
           reps: learned && rp.length ? cfClamp(Math.round(coreMed(rp)), CF.wuReps[0], CF.wuReps[1]) : null,
           c: c, n: h.length, never: c === 0 && typed >= 3 };
}

/* Loadable warm-up weight for ratio p of W (effective loads): a weight he has logged within 8 points of p (real stack weights
   first, C; only those still on his grid, so a one-off typo is never proposed), else the nearest grid weight (B, roundLoad: a
   real pin on pound stacks) that is not more than 8 points over p */
function cfWarmKg(m, W, p) {
  var E = cfEff(m, W), t = E * p, dn = cfLoadAt(m, t, -1), up = cfLoadAt(m, t, 1), best = null;
  loadLadder(m.id).forEach(function (x) {
    var q = cfEff(m, x) / E;
    if (cfLoadOk(m, x) && (x > 0 || m.asis) && cfHarder(m, W, x) && q >= p - 0.08 - 1e-9 && q <= p + 0.08 + 1e-9 && E - cfEff(m, x) >= m.step - 1e-9 && cfOnGrid(m, x) &&
        (best == null || Math.abs(cfEff(m, x) - t) < Math.abs(cfEff(m, best) - t) - 1e-9)) best = x;
  });
  if (best != null) return best;
  if (up == null || cfEff(m, up) / E > p + 0.08 + 1e-9 || !cfHarder(m, W, up)) return dn;
  if (dn == null) return up;
  return Math.abs(cfEff(m, up) - t) < Math.abs(cfEff(m, dn) - t) - 1e-9 ? up : dn;
}

/* The warm-up before today's first working load W: { sets: [{ kg, reps, rest, opt }] (one set at most, always), why, state, by,
   habit, fixed }. Carlos (2026-10-26): exactly one warm-up set, never two (no empty bar first, no ramp on a cold muscle).
   His own ratio and reps once 2 of his last 5 exposures had one (compulsory when half of them did); else by kind when cold
   (75 % x 5 barbell, 75 % x 6 machines, 65 % x 8 isolation), or a lighter, shorter optional set when the muscle already worked
   today. ex.wu over 0: one compulsory set (2 or 3 from older settings count as 1). None for abs, bodyweight, timed holds, tiny
   loads, S.wu 'off' or ex.wu 0. The load is a real one (cfWarmKg: his logged loads first, else roundLoad) */
function cfWarm(id, W, ctx, m) {
  var e = m.e, out = { sets: [], why: '', state: 'cold', by: null, habit: null }, Wk = num(W), ov = num(e.wu), ms, hb, p, opt = false, def,
      src, kg, set, kw, by, ctxt;
  if (S.wu === 'off') { out.why = 'Calentamiento desactivado en ajustes'; return out; }
  if (Wk == null) return out;
  if (m.kind === 'ab' || m.kind === 'bw' || m.secs) { out.why = 'Sin serie de calentamiento en este ejercicio'; return out; }
  ms = cfMuscle(id, ctx && ctx.active); out.state = ms.st; out.by = ms.by;
  hb = cfHabit(m); out.habit = hb;
  if (ov != null && Math.round(ov) <= 0) { out.why = 'Sin calentamiento: lo tienes fijado así'; return out; }
  if (!m.asis && (Wk < 3 * m.step - 1e-9 || (m.lo > 0 && Wk - m.lo < 2 * m.step - 1e-9))) { out.why = cfFit('Con ' + fk(Wk) + ' kg no hace falta calentar'); return out; }
  def = CF.wuDef[m.kind] || CF.wuDef.mc;
  if (hb && hb.learned && hb.ratio != null) { p = [hb.ratio, hb.reps || def[1]]; src = 'habit'; opt = !hb.does && ms.st === 'warm'; }
  else if (ms.st === 'warm') { p = CF.wuWarm; src = 'warm'; opt = true; }
  else { p = def; src = 'cold'; opt = !!(hb && hb.never); }
  if (ov != null && ov > 0) { src = 'fixed'; opt = false; }       // fixed in Rutina: one compulsory set, his own values when learned
  kg = cfWarmKg(m, Wk, p[0]);
  if (kg == null || !cfHarder(m, Wk, kg) || Math.abs(cfEff(m, Wk) - cfEff(m, kg)) < m.step - 1e-9) kg = cfMove(m, Wk, -1);
  if (!cfHarder(m, Wk, kg) || !cfLoadOk(m, kg) || (!m.asis && kg <= 0) || (m.asis && kg > m.bw - 5)) {
    out.why = src === 'fixed' ? 'Calentamiento fijado, pero no hay un peso más ligero' : cfFit('Con ' + fk(Wk) + ' kg no hace falta calentar');
    return out;
  }
  set = { kg: kg, reps: p[1], rest: Math.min(m.rest, CF.wuLast), opt: opt };
  out.sets.push(set);
  out.fixed = src === 'fixed';
  kw = cfKg(m, kg) + ' × ' + set.reps;
  by = ms.by ? String(ms.by).toLowerCase() : '';
  ctxt = by ? ' (tras ' + by + ')' : '';
  out.why = src === 'fixed' ? cfFit('Calentamiento fijado: una serie, ' + kw, 'Calentamiento fijado: una serie')
          : src === 'habit' ? cfFit('Tu serie suave de siempre: ' + kw + ctxt + (opt ? ', opcional' : ''), 'Tu serie suave de siempre: ' + kw + (opt ? ', opcional' : ''))
          : src === 'warm' ? cfFit('Ya caliente' + ctxt + ': ' + kw + ', opcional', 'Ya caliente: ' + kw + ', opcional')
          : cfFit('En frío: ' + kw + ' antes de empezar' + (opt ? ', opcional' : ''), 'En frío: ' + kw + (opt ? ', opcional' : ''));
  return out;
}

/* Public: warm-up sets before first working load W today: { sets, why, state, by, habit } */
function coachWarm(id, W, ctx) { return cfWarm(id, W, ctx || {}, cfModel(id)); }

/* ---------- texts ---------- */

/* Work targets as text: '9 · 8 · 7', or '8, luego 42 kg × 11 · 10' when later sets are lighter */
function cfWorkTxt(m, work) {
  var a = [], b = [], L = work[0].kg, lb = null;
  work.forEach(function (w) { if (cfSame(w.kg, L)) a.push(w.reps); else { b.push(w.reps); lb = w.kg; } });
  return b.length ? cfList(a) + ', luego ' + fk(lb) + ' kg × ' + cfList(b) : cfList(a);
}
/* Sets as text: '60 kg × 8 · 7 · 6', or '70 kg × 6, luego 60 kg × 9 · 8' */
function cfSetsTxt(m, sets) {
  var g = [], cur = null;
  sets.forEach(function (s) { if (!cur || !cfSame(cur.kg, s.kg)) { cur = { kg: s.kg, r: [] }; g.push(cur); } cur.r.push(s.reps); });
  return g.map(function (x, i) { return (i ? fk(x.kg) + ' kg' : cfKg(m, x.kg)) + ' × ' + cfList(x.r); }).join(', luego ');
}
/* Indices as words: '2 y 3' */
function cfIdx(a) { var b = a.map(function (k) { return k + 1; }); return b.length > 1 ? b.slice(0, -1).join(', ') + ' y ' + b[b.length - 1] : String(b[0]); }

/* The one-line why (Spanish, 80 characters at most, no dashes, whole reps). It never contradicts the status word */
function cfWhy(m, d, work) {
  var last = d.last, L0 = last.L0, r1 = last.r1, k0 = cfKg(m, L0), k = cfKg(m, d.L), wt = cfWorkTxt(m, work), up = d.up || {}, lr, s, low, mv, lastLow;
  lr = last.an.struct.filter(function (x) { return cfSame(x.kg, L0); }).slice(0, 4).map(function (x) { return x.reps; });

/* Detail lines for "Por qué" (each 80 characters at most, whole reps, coach words) */

/* ---------- plans ---------- */

/* Status glyph and word for st */
function cfWord(m, st) { var s = (m.asis && CF_STA[st]) || (m.secs && st === 'reps' && CF_STS) || CF_ST[st] || CF_ST.hold; return { glyph: s[0], word: s[1] }; }

  out.why = cfFit(m.asis ? 'Primera vez: elige una asistencia con la que te sobren 2 o 3 reps a las ' + m.max

  out.detail = ['Sin historial: no invento el peso', cfFit('Si pasas de ' + (m.max + 2) + ' reps, ' + (m.asis ? 'quita ayuda' : 'sube peso') + ' en la siguiente serie'),

/* No load to move (bodyweight with nothing added, timed holds, no usable load): progress by reps or seconds only */
function cfRepsOnly(m, out, real, ds) {
  var ws = real.work, r1 = ws[0].reps, u = m.secs ? ' s' : '', inc = m.secs ? Math.max(1, Math.round(r1 * 0.1)) : 1, t1, k, r, lr = [], st, w,
      over = ds < CF.brk[0] && r1 >= m.max + CF.bridge;              // already past the range: nothing to add here (third verification)
  ws.forEach(function (s) { if (lr.length < 4) lr.push(s.reps); });
  if (ds >= CF.brk[0]) { st = 'back'; t1 = Math.max(1, r1 - (m.secs ? inc * 2 : 2)); }
  else if (over) { st = 'hold'; t1 = r1; }                          // seconds: keep his time; reps: capped at max + 3 below
  else { t1 = Math.min(Math.max(m.max, r1) + inc, r1 + inc); st = t1 > m.max ? 'reps' : 'hold'; }
  if (!m.secs) t1 = Math.min(t1, m.max + CF.bridge);
  for (k = 0; k < m.n; k++) {
    r = k ? Math.max(1, Math.min(out.work[k - 1].reps, cfR((t1 + CF.rirT) * cfF(m, k) - CF.rirT))) : t1;
    if (k && st !== 'back' && ws[k]) r = Math.min(out.work[k - 1].reps, Math.max(r, ws[k].reps));
    out.work.push({ kg: ws[0].kg, reps: r, prev: ws[k] ? { kg: ws[k].kg, reps: ws[k].reps } : null });
  }
  w = cfWord(m, st);
  out.status = st; out.glyph = w.glyph; out.word = w.word;
  out.why = st === 'back' ? cfFit(ds + ' días sin hacerlo: empieza con ' + t1 + u + ' y sin forzar')
          : over && m.secs ? cfFit('Ya pasas de ' + m.max + ' s: mantén ' + t1 + ' s o sube el rango en Rutina', 'Ya pasas de ' + m.max + ' s: mantén ' + t1 + ' s')
          : over ? cfFit('Ya pasas de ' + m.max + ' reps sin carga: añade lastre para seguir progresando', 'Ya pasas de ' + m.max + ' reps: añade lastre para progresar')
          : st === 'reps' ? cfFit('Sin carga que subir: suma ' + (m.secs ? 'tiempo' : 'reps') + ', ' + t1 + u + ' en la 1.ª')
          : cfFit('Última ' + cfList(lr) + u + ': hoy busca ' + cfList(out.work.map(function (x) { return x.reps; })) + u);
  out.detail = ['Sin carga: progresas sumando ' + (m.secs ? 'segundos' : 'reps')];
  out.flags = { model: { n: m.ex.length, noLoad: true } };
  return out;
}

/* Warm-state key of a context, for the plan cache */
function cfCtxKey(id, ctx) {
  var ms = cfMuscle(id, ctx && ctx.active), did = ctx && (ctx.day || (ctx.active && ctx.active.day)), before = '';
  if (did && Array.isArray(S.days)) S.days.forEach(function (x) {   // the exercises before it that day (one reset offer per day, cfResetTaken):
    var i = x && x.id === did && Array.isArray(x.ex) ? x.ex.indexOf(id) : -1;   // reordering the routine must not keep a stale offer
    if (i > 0) before = x.ex.slice(0, i).join(',');

  return ms.st + '|' + (ms.by || '') + '|' + (ms.first ? 1 : 0) + '|' + (did || '') + '|' + before + '|' + (ctx && ctx.noAlt ? 1 : 0);

/* ================= métricas: lib/30-metrics.js =================
   Read-time progress metrics for the progress tab, the summary and the exercise detail. Nothing here writes
   to S or to storage, runs at load or touches the DOM. Built on lib/10-core.js (exHist, exInfo, e1rm, exStep,
   roundLoad, musclesOf, dayDiff, WARM_TH) and app.js helpers (num, fk, dfmt, weekStart, S, EX_DEF, TYPE).
   Evidence: SCR/wf1/research-metrics.json, report plus fact-check (the fact-check wins where they disagree).
   - Working sets only: the core decides warm-ups (explicit w flags, wv sessions, legacy heuristic).
   - Session index = Epley e1RM of the best working set with reps <= 12 (low: true when the session only has
     sets above 12 reps). Assisted lifts use body weight minus assistance when S.bw is set; without it idx is
     null and px, a proxy computed with an assumed body weight, only orders sessions and gives the trend its
     direction (its percentages are flagged approx). Never compared or summed across exercises.
   - Trend: least squares on ln(index) against days, last <= 10 sessions within <= 84 days. No verdict below
     5 sessions or a 21 day span. Up: t >= 1.5 (1.64 and 1.53 with 5 and 6 points) and total >= +2 %; down: t <= -2.0 and total <= -3 %
     (asymmetric: a false "baja" costs more than a missed one, fact-check). Hedged copy 5 to 7 sessions, firm 8+.
   - Double progression censoring: a best set at reps >= ex.max is a lower bound (he stopped at the top of the
     range), and so is a session he tapped "sobrado" (item.ef 1, 3+ in reserve; missing effort reads as close to
     failure). A verdict must survive raising those points (1 rep, or 3 when sobrado) where that hurts it, and such
     sessions are never called "sin nueva marca".
   - Familiarisation (Grgic 2020, fact-check): the first 2 exposures never give records; the trend skips the
     first exposure, and the second one too when 5 points remain without it.
   - Breaks (the coach's tiers): a comeback 21+ days after the previous exposure is deliberately lighter (vuelta suave),
     so it is left out of the trend and treated as a lower bound for "sin nueva marca"; after 35+ days the trend restarts.
   - Typos (the coach's rule, cfModel): an exposure whose index is more than 35 % above or 40 % below the median of itself and
     up to 2 exposures each side, on a load not logged in 2 sessions ('625' for 62,5), is odd: left out of the trend, records,
     new marks and estimates (one typo used to block every later record). Sets with an extra digit in the reps (over 3 times
     the top of the range and over 30, timed holds excepted) are left out the same way. Deltas and set counts keep them (facts).

     the previous one calls a flat lifter "better" about a third of the time.
   - Weekly sets per muscle: fractional (indirect 0.5), working sets with reps >= 5. The bands are practitioner
     guidance (Hevy, ACSM press release), not evidence (Pelland found no plateau), and are labelled so.
   - Consistency: rolling count against the goal; nothing breaks, no streaks.

/* Lo que el temporizador enseña ahora: solo se escribe en el DOM lo que cambia (la etiqueta al cambiar de estado, la

    var tm = mmss(left);

  } catch (e) {}
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  if (done) done();

/* Guarda la copia de seguridad y apunta cuándo (gym.lastExport, fuera de gym.v1; Rutina lo enseña). Con los datos
   ilegibles (BLOCK) exporta el texto rescatado y no apunta nada. Es la versión compartida de rtExport() */
function exportData() {

/* Revisa una copia antes de cargarla. Devuelve { ok, why, added: [ids con ficha de relleno], dropActive } y la deja lista

function checkBackup(d) {

  if (!stateOk(d) || !Array.isArray(d.sessions)) return r;

  d.sessions.forEach(function (s, k) {
    if (!isObj(s) || !Array.isArray(s.items)) { bad = bad || 'El entreno ' + (k + 1) + ' de la copia está dañado'; return; }
    s.items.forEach(function (it) { if (!isObj(it) || it.ex == null || !setsOk(it.sets)) bad = bad || 'Un ejercicio del entreno del ' + dfmt(s.start || 0, { day: 'numeric', month: 'short' }) + ' está dañado'; else used[it.ex] = 1; });

/* ---------- cargar una copia: comparar, cargar, deshacer ----------

   carga intercambia las dos: vuelve lo de antes y lo cargado queda aparte, así que también se puede rehacer */
var PREV_KEY = KEY + '.antes-de-cargar';

  (st && Array.isArray(st.sessions) ? st.sessions : []).forEach(function (s) {
    if (!s || typeof s !== 'object') return;

    var t = num(s.start) || 0; if (t > o.last) o.last = t;

}
/* "hoy", "ayer", "13 oct" o "13 oct de 2025" */

  var a = ago(t); if (a === 'hoy' || a === 'ayer') return a;

    lost++; if ((num(s.start) || 0) > B.last) newer++;

  else {

    else {

      if (!lost) t += S.active ? ', todos están en la copia, pero se perdería el entreno en curso.' : ', todos están en la copia.';
      else t += ' y se perderían ' + plural(lost, 'entreno', 'entrenos') +
        (newer === lost ? ' más ' + (lost === 1 ? 'nuevo' : 'nuevos') + ' que la copia' : ' que no están en la copia' + (newer ? ' (' + newer + ' más ' + (newer === 1 ? 'nuevo' : 'nuevos') + ' que ella)' : '')) +
        (S.active ? ' y el entreno en curso.' : '.');

/* Sustituye el estado por una copia ya revisada. Antes guarda lo que había en gym.v1.antes-de-cargar; si no puede, no

function loadBackup(d) {

  if (prev != null) {

  }

/* Lo que hay en gym.v1.antes-de-cargar: { raw, st (estado si se entiende), sum } o null */
function prevLoad() {

/* pantallas (las pega build.py desde src/ui/*.js) */
/* ---- ui/10-shared.js ---- */
/* ================= ui/10-shared.js =================
   Shared UI for every screen: sprite photos, icons, status glyphs (SVG, 2 px stroke), Spanish formatters with
   non-breaking spaces, and small components that return HTML strings with the class names of the v9 skeleton
   (SCR/visual/ux). Owned by the foundation: screen files use these and do not edit this file. A screen that needs
   another shared helper defines it in its own file with its group prefix and lists it in FOUNDATION.md for
   consolidation. ES5 only. Nothing here touches S except to read exercise names and photos. */

/* ---------- photos (sprites in sp/: 200 % wide, one row per exercise; frame 0 start, 1 end) ---------- */

/* Inline style that shows frame f (0 or 1) of the photo id from the sprites, or '' if the id is not in SP */
function bg(id, f) { var m = SP[id]; if (!m) return ''; return 'background-image:url(sp/s' + m[0] + '.jpg);background-size:200% ' + (m[2] * 100) + '%;background-position:' + (f ? 100 : 0) + '% ' + (m[2] > 1 ? (m[1] / (m[2] - 1) * 100).toFixed(4) : 0) + '%'; }
/* Thumbnail of a photo id (first frame). size: '' (56x42), 'l' (72x54) or 'xl' (96x72). Unknown id: an empty tile */
function thumb(id, size) {
  var st = id ? bg(id, 0) : '';
  return '<span class="thumb' + (size ? ' ' + size : '') + (st ? '' : ' none') + '"' + (st ? ' style="' + st + '"' : '') + ' aria-hidden="true"></span>';
}
/* Thumbnail of an exercise id (its photo, if it has one) */
function exThumb(x, size) { var e = S.ex[x]; return thumb(e && e.img, size); }
/* One frame of a photo with the Free Exercise DB credit (the credit must stay in the app) */
function photo(id, f) {
  return '<div class="photo" role="img" aria-label="' + (f ? 'Posición final' : 'Posición inicial') + '"><span class="f" style="' + bg(id, f ? 1 : 0) + '"></span><span class="cr">Free Exercise DB</span></div>';
}
/* Both frames side by side (start, end), for the "Cómo se hace" sheet */
function photoPair(id) { return '<div class="photo-pair">' + photo(id, 0) + photo(id, 1) + '</div>'; }
/* Up to max thumbnails of exercises, then a "+N" tile */
function thumbs(ids, max) {
  max = max || 4;
  var h = ids.slice(0, max).map(function (x) { return exThumb(x); }).join('');
  if (ids.length > max) h += '<span class="more num">+' + (ids.length - max) + '</span>';

/* Result card when every working set is done: the delta against last time, today's reps against then, the meter today */

/* Sets card: warm-ups (collapsed into one row once all are done), done rows, the active row with steppers, pending

/* A done or pending row: type (tap: C or working), value, note, check */
function wRow(i, j, s, k, it, e, p, R, first) {

/* " hecho" after "Calentamiento", " hecha" after "Serie N" */
function wHecha(warm) { return warm ? ' hecho' : ' hecha'; }

/* Duration of a stored session as text ("1 h", never "1 h 0 min"), or '' when it has no usable end */
function resDur(s) { return s && s.end > s.start ? durTxt(s.end - s.start).replace(/\s0 min$/, '') : ''; }
/* Photo id for a day: its first exercise with a photo, else the first of the session */
function resDayImg(d, s) {
  var ids = (d.ex || []).concat(s && Array.isArray(s.items) ? s.items.map(function (it) { return it && it.ex; }) : []), i;
  for (i = 0; i < ids.length; i++) if (S.ex[ids[i]] && S.ex[ids[i]].img) return S.ex[ids[i]].img;
  return null;
}
/* "Hoy · 1 h 11 min · 20 series". Memoised per session: stored sessions never change, so the cache only drops when the
   list changes (another array after an import or a delete, a new session) or the day turns (Hoy, Ayer) */
var RES_SUB = { arr: null, key: '', m: {} };
function resSessSub(s, now) {
  var n = S.sessions.length, last = n ? S.sessions[n - 1] : null, key = n + '|' + (last && last.id) + '|' + resMid(now), id = s.id + '|' + s.start, v;
  if (RES_SUB.arr !== S.sessions || RES_SUB.key !== key) RES_SUB = { arr: S.sessions, key: key, m: {} };
  v = RES_SUB.m[id];
  if (v === undefined) v = RES_SUB.m[id] = [resWhen(s.start, now), resDur(s), plural(sessCount(s).work, 'serie', 'series')].filter(function (x) { return x; }).join(' · ');
  return v;
}
/* Percent as the metrics module prints it: one decimal under 10 %, whole above ("5,3 %", "11 %"); sign when asked */
function resPct(v, sign) {
  var a = Math.abs(v), r = a < 9.95 ? Math.round(a * 10) / 10 : Math.round(a);
  return (sign && r > 0 ? (v > 0 ? '+' : '−') : '') + fk(r) + NB + '%';
}
/* One decimal with a comma ("8,8", "11") */
function resN(x) { return fk(Math.round(x * 10) / 10); }
/* First letter in lower case (to chain a lib sentence after a colon) */
function resLow(t) { t = String(t || ''); return t.charAt(0).toLowerCase() + t.slice(1); }
/* A sentence with its final full stop */
function resDot(t) { t = String(t || '').replace(/\s+$/, ''); return !t || /[.?…]$/.test(t) ? t : t + '.'; }
/* Glyph key of a coach plan */
function resGlyph(p) { return p.status === 'first' ? 'first' : p.glyph; }
/* A load as words: "60 kg", "25 kg de asistencia", "sin asistencia", or "tu peso" (bodyweight or timed, nothing added) */
function resLoad(x, kg) {
  var f = exInfo(x), k = num(kg);
  if (f.asis) return k > 0.005 ? kgTxt(k, true) : 'sin asistencia';
  return !(k > 0.005) && (f.kind === 'bw' || f.secs) ? 'tu peso' : kgTxt(k);
}
/* Load of the coach's first working set in words (see resLoad), or '' when there is none to read */
function resPlanLoad(x, p) {
  var w = p.work && p.work[0], f = exInfo(x);
  if (!w) return '';
  if (w.kg != null) return resLoad(x, w.kg);
  return !f.asis && (f.kind === 'bw' || f.secs) ? 'tu peso' : '';
}
/* Words of the coach statuses when a plan carries none (the lib's are "Sube", "Menos ayuda", "Suma tiempo"...) */
var RES_WORD = { first: 'Primera vez', up: 'Sube', hold: 'Mantén', reps: 'Suma reps', down: 'Baja', back: 'Vuelta suave', reset: 'Reinicia' };
/* The coach's status as one phrase, the way the ficha says it: "Mantén 60 kg", "Sube a 62,5 kg", "Baja a 55 kg",
   "Suma reps con 20 kg", "Vuelta suave con 25 kg", "Reinicia con 45 kg", "Menos ayuda: 30 kg de asistencia",
   "Mantén 35 kg de asistencia". Nothing to load (bodyweight, timed): "Mantén: busca 15 reps", or only the word when bare
   (the targets are written under it). For the consolidation: one shared statusLine for preview, ficha, home and Detalle */
function resStatusTxt(x, p, bare) {
  var f = exInfo(x), st = p.status, kg = resPlanLoad(x, p), word = p.word || RES_WORD[st] || RES_WORD.hold;
  if (st === 'first' || !kg) return st === 'first' ? (p.word || RES_WORD.first) : word;
  if (kg === 'tu peso') return bare ? word : word + ': busca ' + p.work[0].reps + NB + (f.secs ? 's' : 'reps');
  if (f.asis && (st === 'up' || st === 'down')) return word + ': ' + kg;
  if (st === 'up' || st === 'down') return word + ' a ' + kg;
  if (st === 'hold' || kg === 'sin asistencia') return word + ' ' + kg;
  return word + ' con ' + kg;
}
/* The same in lower case after a name, "Press banca: mantén 65 kg" (a comma instead of a second colon) */
function resPlanTxt(x, p) {
  if (p.status === 'first' || !resPlanLoad(x, p)) return 'primera vez, elige ' + (exInfo(x).asis ? 'asistencia' : 'peso');
  return resLow(resStatusTxt(x, p).replace(': ', ', '));
}
/* Name of an exercise before its first comma, whole (lines wrap; never cut mid-word) */
function resName1(n) { return String(n == null ? '' : n).split(',')[0].trim(); }
/* The other days in the order they come after day id (the routine order, wrapping), so the one after next is first */
function resAfter(id) {
  var k = -1, out = [], i, n = S.days.length;
  for (i = 0; i < n; i++) if (S.days[i] && S.days[i].id === id) k = i;
  for (i = 1; i <= n; i++) { var d = S.days[(k + i + n) % n]; if (d && d.id !== id && out.indexOf(d) < 0) out.push(d); }
  return out;
}
/* A coach line written for today, reworded for "Próxima vez" (Progreso and Detalle): no "hoy" */
function resNext2(t) {
  return String(t || '').replace(/: hoy busca /g, ': busca ').replace(/^Hoy busca /, 'Busca ').replace(/, hoy /g, ', busca ').replace(/ en la 1\.ª hoy,/g, ' en la 1.ª,');
}
/* Ficha of an exercise, or when it is gone the base routine's (EX_DEF through the core profile) or a name only; never stored */
function resFicha(x) { var e = S.ex[x], f = exInfo(x); return e || (f && f.e && f.e.n ? f.e : { n: resExName(x) }); }
/* Name of an exercise, also when its ficha is gone */
function resExName(x) { var n = exName(x); return n && n !== x ? n : 'Ejercicio sin ficha'; }
/* True when the exercise is read by reps (or seconds) instead of load: timed, or a bodyweight lift he never loaded */
function resByReps(x, rc) {
  var f = exInfo(x), mx = 0;
  if (rc.mode !== 'load') return true;
  if (f.asis || f.kind !== 'bw') return false;
  exHist(x).forEach(function (y) { y.work.forEach(function (s) { if (s.kg > mx) mx = s.kg; }); });
  return !(mx > 0.005);
}
/* Working sets as one line; reps only ("15 · 12 reps", "58 s") when nothing was added to the body weight */
function resSetsLine(x, sets) {
  var f = exInfo(x), a = (sets || []).filter(function (s) { return num(s.reps) > 0; });
  if (!f.asis && (f.kind === 'bw' || f.secs) && a.length && a.every(function (s) { return !(num(s.kg) > 0.005); })) return repsTxt(a.map(function (s) { return s.reps; })) + NB + (f.secs ? 's' : 'reps');
  return setsLine(a, { asis: f.asis });
}
/* "falta 1 día", "faltan 3 sesiones" */
function resFaltan(n, one, many) { return (n === 1 ? 'falta ' : 'faltan ') + (one ? plural(n, one, many) : n); }
/* "Ver los N" style toggle under a list (44 px). k: key in RES.open; label: closed text */
function resMoreBtn(k, label, cls) {
  var on = !!RES.open[k];
  return '<button type="button" class="' + (cls || 'tgroup-more') + '" data-act="res-more" data-k="' + esc(k) + '" aria-expanded="' + on + '"><span>' +
    esc(nb(on ? 'Ver menos' : label)) + '</span>' + I.chevD + '</button>';
}
/* Paged lists (Últimos entrenos, Historial): the first rows, then pages of RES_PAGE, so a long history never paints at once.
   resShown: rows to show now */
function resShown(k, first, total) { return Math.min(total, Math.max(first, RES.page[k] || first)); }
/* Its toggle in the section head (44 px .section-aside): all (label all) when one page is enough, else "Ver más";
   "Ver menos" once open */
function resPageAside(k, first, total, all) {
  if (total <= first) return '';
  var open = resShown(k, first, total) > first;
  return '<button type="button" class="section-aside" data-act="res-page" data-k="' + esc(k) + '" data-n="' + (open ? first : first + RES_PAGE) + '" aria-expanded="' + open + '">' +
    esc(nb(open ? 'Ver menos' : total <= first + RES_PAGE ? all : 'Ver más')) + '</button>';
}
/* "Ver 20 más" at the end of an open paged list while rows remain (44 px) */
function resPageMore(k, first, total) {
  var n = resShown(k, first, total), m = Math.min(RES_PAGE, total - n);
  if (n <= first || m <= 0) return '';
  return '<button type="button" class="tgroup-more res-page-more" data-act="res-page" data-k="' + esc(k) + '" data-n="' + (n + m) + '"><span>' + esc(nb('Ver ' + m + ' más')) + '</span>' + I.chevD + '</button>';

/* Exercises of the routine, then any other with history (routine order) */
function resExIds() {
  var seen = {}, out = [];
  S.days.forEach(function (d) { (d && d.ex || []).forEach(function (x) { if (!seen[x] && S.ex[x]) { seen[x] = 1; out.push(x); } }); });
  S.sessions.forEach(function (s) { (s && Array.isArray(s.items) ? s.items : []).forEach(function (it) { if (it && it.ex != null && !seen[it.ex]) { seen[it.ex] = 1; out.push(it.ex); } }); });
  return out;
}
/* Horizontal bars of fractional sets per muscle (direct first, then hatched indirect). groups [{ g, direct, indirect, total, v, sub }],
   end: value at the right end, ticks: values marked on every bar (and labelled under them) */
function resHbars(groups, end, ticks) {
  var h = '<div class="hbars">';
  groups.forEach(function (x) {
    var d = Math.max(0, Math.min(100, x.direct / end * 100)), i = Math.max(0, Math.min(100 - d, x.indirect / end * 100));
    h += '<div class="hbar"><span class="hbar-k">' + esc(x.g) + '</span><div class="hbar-t" aria-hidden="true">' +
      (d ? '<i class="d" style="width:' + d.toFixed(2) + '%"></i>' : '') + (i ? '<i class="x" style="left:' + (d ? d + 0.8 : 0).toFixed(2) + '%;width:' + i.toFixed(2) + '%"></i>' : '') +
      (ticks || []).map(function (t) { return '<i class="tk" style="left:' + (t / end * 100).toFixed(2) + '%"></i>'; }).join('') + '</div>' +
      '<span class="hbar-v">' + esc(nb(x.v)) + (x.sub ? '<span>' + esc(x.sub) + '</span>' : '') + '</span></div>';
  });
  h += '</div>';
  if (ticks && ticks.length) h += '<div class="hbar-scale" aria-hidden="true"><div></div><div>' + ticks.map(function (t) { return '<span style="left:' + (t / end * 100).toFixed(2) + '%">' + t + '</span>'; }).join('') + '</div><div></div></div>';
  return h;
}
/* Legend of the muscle bars */
function resLegend(media, ticks) {

    (ticks ? '<span><i class="tk"></i>' + esc(ticks.join(NB + '· ')) + '</span>' : '') + '</div>';
}
/* Neutral sparkline (72 x 28) of index values; the y span is at least 12 % of the middle so noise never looks like a climb */
function resSpark(vals) {
  if (vals.length < 2) return '<span class="sp-empty"></span>';
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), mid = (mn + mx) / 2, sp = Math.max(mx - mn, Math.abs(mid) * 0.12, 1e-9);

/* Index points the trend and the charts may use: no typos, a value, and only since the last restart after a long break */

}
/* Hardest working load of a sets array (least assistance on assisted lifts) */
function resTop(sets, asis) {
  var t = null; (sets || []).forEach(function (s) { if (t === null || (asis ? s.kg < t : s.kg > t)) t = s.kg; }); return t;
}

/* ================= Entrenar (#/) ================= */
function home() {
  var now = Date.now(), h = pageHead(dayLong(now), 'Entrenar'), td;
  h += resWeekCard(now);
  td = S.sessions.filter(function (s) { return s && dayDiff(s.start, now) === 0; });
  if (td.length) {
    h += listCard(td.slice().reverse().map(function (s) {
      var d = resDay(s.day);
      return row({ href: '#/s/' + encodeURIComponent(s.id), img: resDayImg(d, s), title: 'Hoy: ' + d.n,
        sub: ['Hecho a las ' + clockTxt(s.start), resDur(s), plural(sessCount(s).work, 'serie', 'series')].filter(function (x) { return x; }).join(' · ') });
    }).join(''), 'res-today');
  }
  if (S.active) h += resLive(now);
  else if (S.days.length) h += resNext(now);
  else h += '<section class="section">' + emptyNote('Aún no tienes días en tu rutina. Créalos en Rutina.') + '</section>';
  var nid = S.active ? S.active.day : nextDay() && nextDay().id;
  var others = resAfter(nid);
  if (others.length) {
    h += '<section class="section" aria-labelledby="res-h-days">' + sectionHead('Otros días', 'res-h-days') + listCard(others.map(function (d) {
      var l = lastOf(d.id);
      return row({ href: '#/d/' + encodeURIComponent(d.id), img: resDayImg(d), title: d.n,
        sub: (l ? (dayDiff(l.start, now) === 0 ? 'Hecho hoy' : cap(ago(l.start))) : 'Aún sin hacer') + ' · ' + plural((d.ex || []).length, 'ejercicio', 'ejercicios') });
    }).join('')) + '</section>';
  }
  /* the last 3, then pages of 20 ("Ver más", "Ver 20 más"), newest first */
  var all = S.sessions.filter(function (s) { return s; }).reverse();
  if (all.length) {
    var shown = resShown('sess', 3, all.length);
    h += '<section class="section" aria-labelledby="res-h-last">' + sectionHead('Últimos entrenos', 'res-h-last', resPageAside('sess', 3, all.length, 'Ver todos')) +
      listCard(all.slice(0, shown).map(function (s) { return row({ href: '#/s/' + encodeURIComponent(s.id), title: resDay(s.day).n, sub: resSessSub(s, now) }); }).join('') +
        resPageMore('sess', 3, all.length)) + '</section>';
  }
  return h;

/* Week card: pips of this calendar week against the goal, and the last 4 weeks (or the days he has) on the right. No streak */
function resWeekCard(now) {
  var cs = consistency(now), ws = weekStart(now), wk = 0, g = Math.max(1, Math.round(num(S.goal) || 3)), pp = '', i, side = '';
  S.sessions.forEach(function (s) { if (s && s.start >= ws && s.start <= now) wk++; });
  for (i = 0; i < Math.max(g, wk); i++) pp += '<i' + (i < wk ? ' class="on"' : '') + '></i>';
  if (cs.total) {
    var full = cs.win === 28, lab = full ? '4 semanas' : cs.win % 7 === 0 ? plural(cs.win / 7, 'semana', 'semanas') : plural(cs.win, 'día', 'días');
    side = '<p class="week-side">' + esc(lab) + '<br><span class="num">' + esc(nb(full ? cs.last28 + ' de ' + fk(cs.goal28) : cs.inWin + ' de ' + cs.goalWin)) + '</span></p>';
  }
  return '<section class="card week" aria-label="' + esc('Constancia: ' + wk + ' de ' + g + ' entrenos esta semana') + '"><div class="week-main"><div class="week-pips" aria-hidden="true">' + pp + '</div>' +
    '<p class="week-text"><b>' + wk + ' de ' + g + '</b> esta semana</p></div>' + side + '</section>';
}

/* "Siguiente": the next day with its size, last time, photos, at most 2 coach highlights, the plan link (above Empezar,
   judge §6.2) and Empezar (the workout group's "go" action) */
function resNext(now) {
  var nd = nextDay(); if (!nd) return '';
  var ls = lastOf(nd.id), exs = (nd.ex || []).filter(function (x) { return S.ex[x]; }), hl = [];
  if (S.sessions.length) {
    exs.forEach(function (x, k) {
      if (hl.length >= 2) return;
      var p = coachPlan(x, { now: now, active: null });

  }
  var h = '<section class="section" aria-labelledby="res-h-next">' + sectionHead('Siguiente', 'res-h-next') + '<article class="card next">' +
    '<h3 class="card-title">' + esc(nd.n) + '</h3>' +
    '<p class="card-sub">' + esc(nb(plural(exs.length, 'ejercicio', 'ejercicios') + ' · ' + plural(daySets(nd), 'serie', 'series') + ' · unos ' + dayMinutes(nd.id) + ' min')) + '</p>' +
    '<p class="card-foot res-last">' + esc(nb(ls ? 'Última vez ' + ago(ls.start) : 'Aún sin hacer')) + '</p>' + (exs.length ? thumbs(exs, 4) : '');
  if (hl.length) {
    h += '<div class="well plan-list">' + hl.map(function (o) {

        (p.why ? '<div class="plan-item-s">' + esc(nb(p.why)) + '</div>' : '') + '</div></div>';
    }).join('') + '</div>';
  }
  h += '<a class="res-plan-link" href="#/d/' + encodeURIComponent(nd.id) + '"><span>Ver el plan completo</span>' + I.chevR + '</a>' +
    '<button type="button" class="btn-primary" data-act="go" data-d="' + esc(nd.id) + '">Empezar</button></article></section>';
  return h;

/* "En curso" card (estados.html): since when, the day, a meter of working sets with the minutes and the current exercise, Continuar */
function resLive(now) {
  var a = S.active, d = resDay(a.day), c = activeCount(), nm = resLiveName(a);   // the workout header's count (app.js)

    '<p class="card-foot">' + esc(nb('En curso · desde las ' + clockTxt(a.start))) + '</p><h3 class="card-title">' + esc(d.n) + '</h3>' + m +

/* "1 de 15 series · 26 min" */
function resLiveMin(now) { return Math.max(0, Math.round((now - S.active.start) / 60000)); }
function resLiveTxt(c, now) { return c.done + ' de ' + c.total + ' series · ' + resLiveMin(now) + ' min'; }

function resLiveAria(c, now, nm) { return c.done + ' de ' + c.total + ' series hechas, ' + plural(resLiveMin(now), 'minuto', 'minutos') + (nm ? '. Ahora: ' + nm : ''); }
/* Name of the exercise in progress, whole (before its first comma; the label wraps on two lines) */
function resLiveName(a) { var cur = resCurItem(a); return cur ? resName1(exName(cur.ex)) : ''; }
/* Exercise in progress: the first with done and pending rows, else the first with pending rows */
function resCurItem(a) {
  var cur = null, items = a.items || [];
  items.forEach(function (it) { var sets = it.sets || []; if (!cur && sets.some(function (s) { return s.done; }) && sets.some(function (s) { return !s.done; })) cur = it; });
  items.forEach(function (it) { if (!cur && !(S.ex[it.ex] || {}).opt && (it.sets || []).some(function (s) { return !s.done; })) cur = it; });
  items.forEach(function (it) { if (!cur && (it.sets || []).some(function (s) { return !s.done; })) cur = it; });
  return cur;
}
/* Keeps the minutes of the En curso card current without repainting, the meter's label too */
function resLiveTick() {
  var el = document.querySelector('.res-live .meter-label span'); if (!el || !S.active) return;
  var c = activeCount(), now = Date.now(), t = nb(resLiveTxt(c, now)), m = el.closest('.meter'), a;
  if (el.textContent !== t) el.textContent = t;

/* ================= Resumen (#/s/<id>) ================= */
function resSummary(id) {
  var s = null, now = Date.now();
  S.sessions.forEach(function (x) { if (x && x.id === id) s = x; });
  if (!s) { VIEW.tabs = true; VIEW.tab = 'home'; return navBack('#/', 'Entrenar') + emptyNote('No encuentro ese entreno. Puede que se haya borrado.'); }
  var rp = sessionReport(s.id) || { items: [], records: [], muscles: [], sets: 0, warm: 0 }, d = resDay(s.day);
  VIEW.bar = '<a class="btn-primary" href="#/">Listo</a>';
  var h = pageHead('Entreno hecho', d.n, { pushed: true, meta: dayLong(s.start) });
  /* stats: duration, working sets (warm-ups apart), exercises against the day */
  var dur = s.end > s.start ? Math.round((s.end - s.start) / 60000) : null, dv;
  dv = dur === null ? '<span class="res-none">·</span>' : dur < 60 ? dur + '<small>' + NB + 'min</small>'
    : Math.floor(dur / 60) + '<small>' + NB + 'h</small>' + (dur % 60 ? ' ' + (dur % 60) + '<small>' + NB + 'min</small>' : '');
  /* exercises against the day: optional ones count only when he did them, so skipping one still reads "5 de 5 · todos" */
  var plan = (d.ex || []).filter(function (x) { return S.ex[x]; }), done = {}, have = 0, need = 0, miss = 0, extra = 0;
  rp.items.forEach(function (it) { done[it.ex] = 1; });
  plan.forEach(function (x) { if (done[x]) { have++; need++; } else if (!S.ex[x].opt) { miss++; need++; } });
  rp.items.forEach(function (it) { if (plan.indexOf(it.ex) < 0) extra++; });
  var nEx = rp.items.length, exV = need && !extra ? have + '<small>' + NB + 'de ' + need + '</small>' : String(nEx);
